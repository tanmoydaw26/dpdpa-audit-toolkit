<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DPDP Act audit workbench — KavachPay</title>
<style>
/* ==========================================================================
   DPDP Act, 2023 — audit workbench
   Two typefaces only, with one rule: prose is set in the serif, every figure
   and label in the monospace. That is the logic of an audit workpaper — typed
   narrative against ruled columns of numbers — and it does the work a third
   UI face would otherwise do.
   ========================================================================== */
:root{
  color-scheme: light;

  --paper:#DCE3E4;      /* page — pale cool slate, the colour of file board */
  --bond:#F6F8F7;       /* panels — near-white with the faintest green cast */
  --bond-sink:#EDF1F0;  /* recessed panels */
  --ink:#121E24;        /* text — deep petrol, not black */
  --ink-soft:#4A5C64;
  --ink-faint:#7C8C92;
  --rule:#B4C1C3;
  --rule-soft:#D2DBDB;
  --indigo:#1D3C6E;     /* structure: statutory rail, headings, maturity */
  --mark:#A32530;       /* the reviewer's pen: risk, gaps, shortfall — only */
  --verified:#1C6A5A;   /* verified, compliant — only */
  --amber:#8A5A11;      /* high severity */

  --r0:#EFF2F1; --r1:#E9D8D7; --r2:#DCB4B2; --r3:#C57E7F; --r4:#A32530;

  --serif:Constantia,Cambria,"Palatino Linotype",Palatino,"Iowan Old Style",Charter,Georgia,serif;
  --mono:"Cascadia Mono","Cascadia Code",Consolas,"SF Mono",Menlo,"Roboto Mono","DejaVu Sans Mono",monospace;

  --sp:16px;
  --spine-w:262px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--serif); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--indigo)}
:focus-visible{outline:2px solid var(--indigo); outline-offset:2px}

/* ---- shared type devices ------------------------------------------------ */
.lbl{
  font-family:var(--mono); font-size:9.5px; letter-spacing:.13em;
  text-transform:uppercase; color:var(--ink-faint); display:block;
}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums}
.prose{max-width:74ch}
.hint{font-family:var(--mono); font-size:11px; color:var(--ink-faint); line-height:1.5}

/* ---- masthead ---------------------------------------------------------- */
.masthead{
  background:var(--ink); color:var(--bond);
  padding:18px var(--sp) 15px; display:flex; flex-wrap:wrap; gap:18px;
  align-items:flex-end; justify-content:space-between;
  border-bottom:3px solid var(--indigo);
}
.masthead .lbl{color:#8FA3AB}
.masthead h1{
  font-size:25px; font-weight:600; letter-spacing:-.012em; margin:3px 0 2px;
  line-height:1.15;
}
.mast-meta{
  margin:0; font-family:var(--mono); font-size:11px; letter-spacing:.02em;
  color:#9BB0B7;
}
.mast-actions{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.btn{
  font-family:var(--mono); font-size:11px; letter-spacing:.06em;
  text-transform:uppercase; background:transparent; color:var(--bond);
  border:1px solid #43585F; padding:7px 12px; cursor:pointer;
}
.btn:hover{background:#1D2E36; border-color:#6D858D}
.btn--go{background:var(--bond); color:var(--ink); border-color:var(--bond)}
.btn--go:hover{background:#fff; color:var(--ink)}
.savestate{font-family:var(--mono); font-size:10.5px; color:#8FA3AB; min-width:11ch}

/* ---- view tabs --------------------------------------------------------- */
.views{
  display:flex; gap:0; background:var(--bond);
  border-bottom:1px solid var(--rule); padding:0 var(--sp);
  overflow-x:auto;
}
.tab{
  font-family:var(--mono); font-size:11px; letter-spacing:.1em;
  text-transform:uppercase; background:none; border:0;
  border-bottom:3px solid transparent; padding:12px 16px; cursor:pointer;
  color:var(--ink-soft); white-space:nowrap;
}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--indigo); border-bottom-color:var(--indigo)}
.tab .tally{color:var(--ink-faint); margin-left:7px}
.tab[aria-selected="true"] .tally{color:var(--indigo)}

/* ---- frame ------------------------------------------------------------- */
.frame{display:flex; align-items:flex-start; gap:0}
.spine{
  width:var(--spine-w); flex:0 0 var(--spine-w);
  position:sticky; top:0; max-height:100vh; overflow-y:auto;
  background:var(--bond); border-right:1px solid var(--rule);
  padding:var(--sp) 14px 40px;
}
.main{flex:1 1 auto; min-width:0; padding:var(--sp) var(--sp) 72px; max-width:1120px}

/* ---- the spine: dashboard and navigation in one object ----------------- */
.overall{border-bottom:1px solid var(--rule); padding-bottom:14px; margin-bottom:14px}
.overall__figure{
  font-family:var(--mono); font-size:42px; font-weight:600; line-height:1;
  letter-spacing:-.03em; color:var(--indigo); font-variant-numeric:tabular-nums;
}
.overall__figure sup{font-size:18px; font-weight:400; top:-.85em; margin-left:1px}
.overall__band{font-size:15px; font-weight:600; margin:4px 0 10px}
.overall__note{font-family:var(--mono); font-size:10.5px; color:var(--ink-soft); line-height:1.5}

/* The bar is quartered because the scale is quartered: the gridlines sit at
   the 1, 2 and 3 anchors, so a fill is read against the scoring anchors
   rather than as a bare proportion. */
.bar{position:relative; height:9px; background:var(--bond-sink); border:1px solid var(--rule-soft)}
.bar__fill{position:absolute; inset:0 auto 0 0; background:var(--indigo); transition:width .28s ease}
.bar__ticks{position:absolute; inset:0; pointer-events:none;
  background-image:linear-gradient(to right,transparent calc(25% - .5px),var(--rule) calc(25% - .5px),var(--rule) calc(25% + .5px),transparent calc(25% + .5px)),
                   linear-gradient(to right,transparent calc(50% - .5px),var(--rule) calc(50% - .5px),var(--rule) calc(50% + .5px),transparent calc(50% + .5px)),
                   linear-gradient(to right,transparent calc(75% - .5px),var(--rule) calc(75% - .5px),var(--rule) calc(75% + .5px),transparent calc(75% + .5px));
}
.bar--tall{height:13px}

.spine__all{width:100%; text-align:left; background:none; border:0; border-top:1px solid var(--rule-soft); padding:9px 6px; cursor:pointer}
.domrow{
  display:grid; grid-template-columns:34px 1fr 40px; gap:7px; align-items:center;
  width:100%; text-align:left; background:none; border:0;
  border-top:1px solid var(--rule-soft); padding:7px 6px; cursor:pointer;
}
.domrow:hover{background:var(--bond-sink)}
.domrow[aria-current="true"]{background:var(--bond-sink); box-shadow:inset 3px 0 0 var(--indigo)}
.domrow__code{font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:.04em}
.domrow__name{font-size:12px; line-height:1.25; color:var(--ink-soft)}
.domrow__bar{grid-column:2; margin-top:4px}
.domrow__pct{font-family:var(--mono); font-size:11px; text-align:right; font-variant-numeric:tabular-nums}
.domrow__gaps{grid-column:3; font-family:var(--mono); font-size:10px; color:var(--mark); text-align:right}
.spine__foot{margin-top:16px; border-top:1px solid var(--rule); padding-top:12px}

/* ---- section furniture -------------------------------------------------- */
.sec{margin:0 0 30px}
.sec__head{border-bottom:2px solid var(--ink); padding-bottom:7px; margin-bottom:14px}
.sec__head h2{font-size:20px; font-weight:600; letter-spacing:-.01em; margin:3px 0 0}
.sec__lede{margin:10px 0 18px; color:var(--ink-soft); font-size:14px; max-width:78ch}
.panel{background:var(--bond); border:1px solid var(--rule); padding:16px 18px; margin-bottom:16px}
.panel--sink{background:var(--bond-sink)}

/* ---- domain header ----------------------------------------------------- */
.domhead{background:var(--bond); border:1px solid var(--rule); border-left:5px solid var(--indigo); padding:15px 18px; margin-bottom:16px}
.domhead h3{margin:2px 0 8px; font-size:19px; font-weight:600}
.domhead p{margin:0 0 7px; font-size:14px; color:var(--ink-soft); max-width:80ch}
.domhead p:last-child{margin-bottom:0}

/* ---- fieldwork toolbar ------------------------------------------------- */
.tools{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:16px}
.search{
  font-family:var(--mono); font-size:12px; padding:8px 10px; min-width:250px;
  background:var(--bond); border:1px solid var(--rule);
}
.chip{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.07em; text-transform:uppercase;
  background:var(--bond); border:1px solid var(--rule); padding:7px 11px; cursor:pointer;
  color:var(--ink-soft);
}
.chip:hover{border-color:var(--ink-soft); color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--bond)}
.chip .tally{opacity:.65; margin-left:6px}

/* ---- control card ------------------------------------------------------ */
.card{
  display:grid; grid-template-columns:168px 1fr;
  background:var(--bond); border:1px solid var(--rule); margin-bottom:14px;
}
.card--out{opacity:.62}
.card--gap{border-left:4px solid var(--mark)}
.card--ok{border-left:4px solid var(--verified)}
.card--open{border-left:4px solid var(--rule)}

/* The statutory rail. Every card carries its authority in the margin, the way
   a printed Act carries section numbers — and where the Rules citation has not
   been verified the rail shows a ruled blank instead of a number, so an
   unverified citation looks unverified. */
.rail{
  background:var(--bond-sink); border-right:1px solid var(--rule);
  padding:14px 13px; font-family:var(--mono); font-size:11px; line-height:1.45;
}
.rail__id{font-size:14px; font-weight:600; letter-spacing:.03em; color:var(--indigo)}
.rail__grp{margin-top:12px}
.rail__grp .lbl{font-size:9px; margin-bottom:2px}
.rail__act{color:var(--ink); font-weight:600}
.rail__slot{
  display:block; border-bottom:1.5px dotted var(--mark); min-height:15px;
  margin:2px 0 3px; color:var(--mark);
}
.rail__slot-note{color:var(--mark); font-size:9.5px; letter-spacing:.06em; text-transform:uppercase}
.rail__ok{color:var(--verified)}
.rail__pen{color:var(--ink-soft)}
.sev{display:inline-block; font-size:9.5px; letter-spacing:.08em; text-transform:uppercase}
.sev--critical{color:var(--mark); font-weight:600}
.sev--high{color:var(--amber); font-weight:600}
.sev--medium{color:var(--ink-soft)}
.sev--low{color:var(--ink-faint)}

.body{padding:14px 18px 16px; min-width:0}
.body h4{margin:0 0 8px; font-size:17px; font-weight:600; letter-spacing:-.005em; line-height:1.3}
.oblig{margin:0 0 12px; max-width:78ch}
.qt{border-left:2px solid var(--rule); padding:0 0 0 12px; margin:0 0 12px}
.qt p{margin:2px 0 0; font-size:14px; max-width:76ch}
.evlist{margin:0 0 12px; padding:0; list-style:none}
.evlist li{font-size:13px; color:var(--ink-soft); padding-left:14px; position:relative; margin-bottom:2px}
.evlist li::before{content:"·"; position:absolute; left:4px; color:var(--rule)}
.note{background:var(--bond-sink); border:1px solid var(--rule-soft); padding:9px 12px; margin:0 0 12px; font-size:13px; color:var(--ink-soft)}

/* ---- the anchored scale ------------------------------------------------ */
/* 0, 2 and 4 are described in the library; 1 and 3 are not. The stops are
   sized to say so — large squares where there is a definition, small ticks
   where the auditor is interpolating. */
.scale{margin:14px 0 0}
.stops{position:relative; display:flex; align-items:center; gap:0; height:34px; max-width:430px}
.stops::before{content:""; position:absolute; left:9px; right:9px; top:50%; height:1px; background:var(--rule)}
.stop{
  position:relative; flex:1 1 0; display:flex; align-items:center; justify-content:center;
  background:none; border:0; padding:0; cursor:pointer; height:34px;
}
.stop__mk{
  display:flex; align-items:center; justify-content:center;
  background:var(--bond); border:1.5px solid var(--rule);
  font-family:var(--mono); font-size:12px; color:var(--ink-soft);
}
.stop--anchor .stop__mk{width:26px; height:26px}
.stop--mid .stop__mk{width:17px; height:17px; font-size:10px; border-style:dashed}
.stop:hover .stop__mk{border-color:var(--indigo); color:var(--indigo)}
.stop[aria-checked="true"] .stop__mk{background:var(--indigo); border-color:var(--indigo); color:#fff; font-weight:600}
.stop__cap{position:absolute; bottom:-1px; font-family:var(--mono); font-size:8.5px; color:var(--ink-faint)}

.scalefoot{display:flex; flex-wrap:wrap; gap:14px; align-items:center; margin-top:6px}
.na{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.07em; text-transform:uppercase;
  background:var(--bond); border:1px dashed var(--rule); padding:6px 10px; cursor:pointer; color:var(--ink-soft);
}
.na:hover{border-color:var(--ink-soft)}
.na[aria-pressed="true"]{background:var(--ink-soft); border-color:var(--ink-soft); border-style:solid; color:var(--bond)}

.anchors{margin:12px 0 0; border-top:1px solid var(--rule-soft); padding-top:10px}
.anchors dl{display:grid; grid-template-columns:22px 1fr; gap:3px 10px; margin:0}
.anchors dt{font-family:var(--mono); font-size:12px; font-weight:600; color:var(--indigo); text-align:center}
.anchors dd{margin:0 0 4px; font-size:13px; color:var(--ink-soft); max-width:76ch}
.anchors .between{margin:7px 0 0; font-family:var(--mono); font-size:10.5px; color:var(--ink-faint)}

/* ---- capture fields ---------------------------------------------------- */
.capture{margin-top:14px; border-top:1px solid var(--rule-soft); padding-top:12px}
.fields{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px}
.f{display:block}
.f textarea,.f input{
  width:100%; background:#fff; border:1px solid var(--rule); padding:7px 9px;
  font-family:var(--serif); font-size:13.5px; margin-top:3px;
}
.f textarea{resize:vertical; min-height:62px; line-height:1.5}
.f input{font-family:var(--mono); font-size:12px}
.f--wide{grid-column:1/-1}
.f--want input{border-color:var(--mark); background:#FFF9F9}
.f--want .lbl{color:var(--mark)}

/* ---- status strip ------------------------------------------------------ */
.strip{
  display:flex; flex-wrap:wrap; gap:6px 16px; align-items:baseline;
  margin-top:12px; border-top:1px solid var(--rule-soft); padding-top:9px;
  font-family:var(--mono); font-size:11px;
}
.strip__st{font-weight:600}
.strip__st--gap{color:var(--mark)}
.strip__st--ok{color:var(--verified)}
.strip__st--open{color:var(--ink-faint)}
.strip__k{color:var(--ink-faint)}

/* ---- tables ------------------------------------------------------------ */
.tw{overflow-x:auto; background:var(--bond); border:1px solid var(--rule)}
table.t{border-collapse:collapse; width:100%; font-size:13px}
table.t th{
  font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase;
  text-align:left; padding:9px 10px; background:var(--ink); color:var(--bond);
  font-weight:400; white-space:nowrap; vertical-align:bottom;
}
table.t td{padding:8px 10px; border-top:1px solid var(--rule-soft); vertical-align:top}
table.t tbody tr:hover{background:var(--bond-sink)}
table.t .c{text-align:center}
table.t .n{font-family:var(--mono); font-variant-numeric:tabular-nums; white-space:nowrap}
table.t .id{font-family:var(--mono); font-size:12px; font-weight:600; color:var(--indigo); white-space:nowrap}
.pri{font-family:var(--mono); font-size:11px; font-weight:600}
.pri--P1{color:var(--mark)}
.pri--P2{color:var(--amber)}
.pri--P3,.pri--P4{color:var(--ink-soft)}

/* ---- the risk grid ----------------------------------------------------- */
/* The grid is the formula: severity rank down, score across, and the cell is
   their product. Nothing is inferred that the arithmetic does not give. */
.grid{border-collapse:collapse; font-family:var(--mono); font-size:12px}
.grid th{font-size:9.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-faint); font-weight:400; padding:5px 8px}
.grid th.rowh{text-align:right; white-space:nowrap}
.grid td{padding:0}
.cell{
  width:74px; height:52px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  border:1px solid var(--bond); background:var(--r0); cursor:pointer; gap:1px;
}
.cell__n{font-size:16px; font-weight:600; font-variant-numeric:tabular-nums}
.cell__r{font-size:9px; letter-spacing:.05em; opacity:.72}
.cell--0{background:var(--r0)} .cell--1{background:var(--r1)}
.cell--2{background:var(--r2)} .cell--3{background:var(--r3); color:#fff}
.cell--4{background:var(--r4); color:#fff}
.cell--empty{color:var(--ink-faint); cursor:default}
.cell--empty .cell__n{font-weight:400}
.gridkey{font-family:var(--mono); font-size:10.5px; color:var(--ink-faint); margin-top:8px}

/* ---- figure strip ------------------------------------------------------ */
.figs{display:grid; grid-template-columns:repeat(auto-fit,minmax(158px,1fr)); gap:1px; background:var(--rule); border:1px solid var(--rule); margin-bottom:18px}
.fig{background:var(--bond); padding:13px 15px}
.fig__v{font-family:var(--mono); font-size:23px; font-weight:600; line-height:1.1; font-variant-numeric:tabular-nums}
.fig__v--mark{color:var(--mark)}
.fig__v--indigo{color:var(--indigo)}
.fig__s{font-family:var(--mono); font-size:10px; color:var(--ink-faint); margin-top:3px}

/* ---- citations --------------------------------------------------------- */
.slot{border-bottom:1.5px dotted var(--mark); color:var(--mark); display:inline-block; min-width:150px}
.stat{font-family:var(--mono); font-size:9.5px; letter-spacing:.07em; text-transform:uppercase; white-space:nowrap}
.stat--ok{color:var(--verified)}
.stat--no{color:var(--mark)}
.cids{font-family:var(--mono); font-size:11px; color:var(--ink-soft); line-height:1.5}

/* ---- scope view -------------------------------------------------------- */
.flag{display:grid; grid-template-columns:1fr 84px; gap:10px 16px; align-items:start; border-top:1px solid var(--rule-soft); padding:12px 0}
.flag:first-of-type{border-top:0}
.flag__name{font-family:var(--mono); font-size:12px; font-weight:600; color:var(--indigo)}
.flag__desc{font-size:13px; color:var(--ink-soft); margin:3px 0 0; max-width:76ch}
.flag__gates{font-family:var(--mono); font-size:10px; color:var(--ink-faint); margin-top:4px}
.tog{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.07em; text-transform:uppercase;
  width:100%; padding:7px 0; cursor:pointer; border:1px solid var(--rule); background:var(--bond); color:var(--ink-soft);
}
.tog[aria-pressed="true"]{background:var(--indigo); border-color:var(--indigo); color:#fff}
.tog:hover{border-color:var(--indigo)}

.empty{background:var(--bond); border:1px dashed var(--rule); padding:24px; text-align:center; color:var(--ink-soft)}
.empty p{margin:0 0 6px}
.empty p:last-child{margin:0; font-family:var(--mono); font-size:11px; color:var(--ink-faint)}

.caveat{font-size:13px; color:var(--ink-soft); max-width:82ch; margin:10px 0 0}
.fold{background:none; border:0; padding:0; font-family:var(--mono); font-size:10.5px; color:var(--indigo); cursor:pointer; text-decoration:underline}

@media (max-width:900px){
  .frame{flex-direction:column}
  .spine{position:static; width:auto; flex:1 1 auto; max-height:none; border-right:0; border-bottom:1px solid var(--rule)}
  .card{grid-template-columns:1fr}
  .rail{border-right:0; border-bottom:1px solid var(--rule); display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px}
  .rail__grp{margin-top:0}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important; animation:none !important}
}
</style>
</head>
<body>

<header class="masthead">
  <div>
    <span class="lbl">Digital Personal Data Protection Act, 2023 &middot; compliance audit</span>
    <h1 id="mastEntity">&nbsp;</h1>
    <p class="mast-meta" id="mastMeta">&nbsp;</p>
  </div>
  <div class="mast-actions">
    <span class="savestate" id="saveState"></span>
    <button class="btn" id="btnOpen">Open assessment file</button>
    <button class="btn btn--go" id="btnSave">Save assessment file</button>
    <button class="btn" id="btnNew">Start a new assessment</button>
    <input type="file" id="fileIn" accept=".json,application/json" hidden>
  </div>
</header>

<nav class="views" role="tablist" aria-label="Views">
  <button class="tab" role="tab" data-view="scope"   aria-selected="false">Scope</button>
  <button class="tab" role="tab" data-view="field"   aria-selected="false">Fieldwork <span class="tally" id="tallyField"></span></button>
  <button class="tab" role="tab" data-view="find"    aria-selected="false">Findings <span class="tally" id="tallyFind"></span></button>
  <button class="tab" role="tab" data-view="cite"    aria-selected="false">Citations <span class="tally" id="tallyCite"></span></button>
</nav>

<div class="frame">
  <aside class="spine" id="spine" aria-label="Maturity by domain"></aside>
  <main class="main" id="main"></main>
</div>

<script>
"use strict";

/* ======================================================================== */
/* DATA — generated from controls/*.yaml by webapp/build_webapp.py.          */
/* Editing the YAML and rebuilding is the only way to change the library, so */
/* the app, the CLI, the workbook and the report cannot drift apart.         */
/* ======================================================================== */
// <<<DATA
const DATA = {"library_version":"1.0.0","substantially_compliant":3,"severity_rank":{"critical":4,"high":3,"medium":2,"low":1},"maturity_bands":[[0.0,20.0,"Absent","Little or no capability. Fundamental obligations are unaddressed."],[20.0,40.0,"Initial","Isolated activity without programme structure. Exposure is broad."],[40.0,60.0,"Developing","Core obligations addressed; significant gaps remain in evidence and coverage."],[60.0,80.0,"Managed","Programme substantially in place. Residual gaps are specific and tractable."],[80.0,100.01,"Optimised","Obligations met, evidenced and tested, with continuing assurance."]],"risk_bands":[[12,17,"Critical"],[8,12,"High"],[4,8,"Medium"],[1,4,"Low"],[0,1,"None"]],"priority_rules":[["P1",12,30,"Immediate — remediate within 30 days"],["P2",8,60,"High — remediate within 60 days"],["P3",4,90,"Medium — remediate within 90 days"],["P4",0,180,"Low — remediate within 180 days"]],"profile_flags":[{"name":"is_sdf","default":false,"description":"Notified by the Central Government as a Significant Data Fiduciary under s.10(1). Set True only on actual notification, not on self-assessment."},{"name":"processes_children_data","default":true,"description":"Processes personal data of individuals under 18, or of persons with a lawful guardian. Defaults True because age is rarely reliably excluded."},{"name":"processes_employee_data","default":true,"description":"Processes personal data of employees, workers or contractors."},{"name":"uses_consent_manager","default":false,"description":"Receives or manages consent through a registered Consent Manager under s.6(7)."},{"name":"is_consent_manager","default":false,"description":"The entity itself acts as a Consent Manager and requires registration under s.6(8)."},{"name":"has_pre_commencement_data","default":true,"description":"Holds personal data processed on the basis of consent given before commencement, engaging the retrospective notice duty under s.5(2)."},{"name":"regulated_sector","default":false,"description":"Subject to sectoral regulation that may impose stricter localisation or transfer requirements preserved by s.16(2) — banking, payments, insurance, telecom, securities, health."},{"name":"claims_exemption","default":false,"description":"Claims any exemption under s.17, including the class-based route in s.17(3)."},{"name":"startup_exempt_s8_3","default":false,"description":"Exempt from s.8(3) as a notified class under s.17(3). Requires actual notification."},{"name":"startup_exempt_s8_7","default":false,"description":"Exempt from s.8(7) as a notified class under s.17(3). Requires actual notification."},{"name":"startup_exempt_s11","default":false,"description":"Exempt from s.11 as a notified class under s.17(3). Requires actual notification."}],"domains":[{"code":"APP","order":1,"name":"Applicability & Role Determination","weight":1.0,"scope_question":"Does the entity correctly understand whether the Act applies to it, in what capacity, and with what exemptions?","why_it_matters":"Every downstream obligation depends on this determination. An entity that has mis-scoped itself as a Data Processor, or has assumed an exemption it does not hold, will have built its entire programme on the wrong footing. This domain is audited first and its findings gate the rest of the report."},{"code":"GOV","order":2,"name":"Governance, Accountability & Records","weight":1.2,"scope_question":"Is there an accountable owner, a documented programme, and a record of processing sufficient to demonstrate compliance to the Board?","why_it_matters":"Section 8(1) makes the Data Fiduciary responsible for compliance including for processing carried out by a Data Processor on its behalf. Section 6(10) places the burden of proving valid consent on the Data Fiduciary. Both are evidential burdens — an entity that is compliant in practice but cannot demonstrate it will fail an inquiry."},{"code":"PUR","order":3,"name":"Lawful Purpose, Minimisation & Accuracy","weight":1.0,"scope_question":"Is personal data processed only for a lawful purpose, limited to what is necessary, and kept accurate where it drives decisions?","why_it_matters":"Section 4 permits processing only for a lawful purpose and only with consent or for a legitimate use. Section 6(1) limits consent to the personal data necessary for the specified purpose, and section 6(2) invalidates consent to the extent it covers anything beyond that — so over-collection does not merely breach a principle, it voids the lawful basis for the excess."},{"code":"NOT","order":4,"name":"Notice","weight":1.1,"scope_question":"Is a compliant notice given with or before every consent request, and was retrospective notice given for pre-commencement consent?","why_it_matters":"Notice is the mechanism by which consent becomes informed. A defective notice therefore undermines the validity of the consent obtained on the back of it, converting a transparency failure into a lawful-basis failure."},{"code":"CON","order":5,"name":"Consent","weight":1.3,"scope_question":"Is consent free, specific, informed, unconditional and unambiguous, with a genuine and equally easy withdrawal path — and can the entity prove it?","why_it_matters":"Consent is the principal lawful basis under the Act and the one most commonly implemented defectively: bundled, pre-ticked, conditioned on service, or withdrawable only by writing to an inbox. Section 6(10) puts the burden of proof on the Data Fiduciary, which makes the consent artefact — not the consent policy — the audited object."},{"code":"CMG","order":6,"name":"Consent Manager","weight":0.8,"scope_question":"Where consent is given or managed through a Consent Manager, is that entity registered with the Board and are the interfaces sound?","why_it_matters":"Section 6(7) lets a Data Principal give, manage, review and withdraw consent through a Consent Manager, which must be registered with the Board and is accountable to the Data Principal. Relying on an unregistered intermediary does not transfer the Data Fiduciary's own accountability under section 8(1)."},{"code":"LGU","order":7,"name":"Legitimate Uses","weight":0.9,"scope_question":"Where processing proceeds without consent, is a specific section 7 legitimate use correctly identified and documented?","why_it_matters":"Section 7 is a closed list, not a balancing test. There is no general \"legitimate interests\" ground of the kind found in the GDPR, so an entity that has mapped its GDPR legitimate-interests assessments across to the Act will usually find the ground does not exist here. Over-reliance on the employment limb in section 7(i) is the most frequent error."},{"code":"RET","order":8,"name":"Retention & Erasure","weight":1.1,"scope_question":"Is personal data erased when consent is withdrawn or the purpose is served, and is that erasure propagated to processors and backups?","why_it_matters":"Section 8(7) requires erasure on withdrawal of consent or once the purpose is no longer being served, unless retention is required by law, and requires the Data Fiduciary to cause its processors to erase as well. Erasure that stops at the primary database — leaving data in warehouses, logs, backups and vendor systems — is the standard finding here."},{"code":"RGT","order":9,"name":"Data Principal Rights","weight":1.1,"scope_question":"Can a Data Principal actually obtain access, correction, erasure and nomination, within the prescribed period and without undue friction?","why_it_matters":"Rights under sections 11, 12 and 14 are tested by exercising them, not by reading the privacy policy. The audit approach in this domain is deliberately operational: submit requests and measure what happens."},{"code":"GRV","order":10,"name":"Grievance Redressal","weight":1.0,"scope_question":"Is there an effective, reachable grievance mechanism that responds within the prescribed period?","why_it_matters":"Section 8(9) requires an effective mechanism and section 13 makes it a right. A Data Principal must exhaust it before approaching the Board, which means the grievance channel is the entity's own opportunity to resolve a matter before it becomes an inquiry. A channel that does not respond converts routine complaints into Board complaints."},{"code":"SEC","order":11,"name":"Security Safeguards","weight":1.4,"scope_question":"Are reasonable security safeguards implemented to prevent a personal data breach, including in respect of processors?","why_it_matters":"Section 8(5) carries the highest penalty exposure in the Schedule — up to INR 250 crore. Note the construction: the duty is to take reasonable safeguards to prevent a breach, so liability can attach to the inadequacy of the safeguards themselves, independently of whether a breach has occurred."},{"code":"BRC","order":12,"name":"Personal Data Breach Notification","weight":1.3,"scope_question":"Can the entity detect, assess and intimate a personal data breach to the Board and to every affected Data Principal, in the prescribed manner?","why_it_matters":"Section 8(6) requires intimation to the Board and to each affected Data Principal, with penalty exposure up to INR 200 crore. The Act draws no materiality threshold on its face — the assumption that only \"significant\" breaches are reportable is a common and expensive misreading. Notification to every affected individual is operationally demanding and needs to be rehearsed, not merely documented."},{"code":"CHD","order":13,"name":"Children & Persons with Disability","weight":1.2,"scope_question":"Is verifiable parental or guardian consent obtained, and are tracking, behavioural monitoring and targeted advertising to children prevented?","why_it_matters":"Section 9 sets the age of a child at below eighteen years — materially higher than the thirteen-to-sixteen range most global platforms are built for — and prohibits tracking, behavioural monitoring and targeted advertising directed at children outright, with no consent-based cure. Penalty exposure is up to INR 200 crore. The same regime extends to persons with disability who have a lawful guardian."},{"code":"PRO","order":14,"name":"Processors & Vendor Contracts","weight":1.1,"scope_question":"Is every Data Processor engaged under a valid contract, with safeguards, erasure and breach obligations flowed down and monitored?","why_it_matters":"Section 8(1) leaves the Data Fiduciary responsible for a processor's processing, and section 8(2) permits engagement only under a valid contract. The exposure is asymmetric: the vendor's failure is the entity's penalty. Sub-processors are where this domain usually breaks."},{"code":"XBD","order":15,"name":"Cross-Border Transfers","weight":0.9,"scope_question":"Are transfers outside India mapped, and compliant with both section 16 and any stricter sectoral law?","why_it_matters":"Section 16 restricts transfer to countries the Central Government notifies, operating as a negative list rather than an adequacy regime. Section 16(2) expressly preserves higher restrictions under other law, so sectoral localisation directions — RBI payment data being the clearest example — bind more tightly than the Act and are the real constraint for regulated entities."},{"code":"SDF","order":16,"name":"Significant Data Fiduciary Obligations","weight":1.2,"scope_question":"If notified as a Significant Data Fiduciary, are the DPO, independent auditor, DPIA, periodic audit and algorithmic due diligence in place?","why_it_matters":"Section 10 obligations attach only on notification by the Central Government, but the factors in section 10(1) — volume and sensitivity of data, risk to Data Principals' rights, risk to electoral democracy, security of the State — are reasonably foreseeable. An entity plainly within them should be building capability ahead of designation rather than after it. Penalty exposure is up to INR 150 crore."},{"code":"BRD","order":17,"name":"Enforcement Readiness & Board Engagement","weight":0.7,"scope_question":"Could the entity respond to a Board inquiry, produce evidence on demand, and make an informed decision about a voluntary undertaking?","why_it_matters":"Section 28 governs inquiry procedure, section 32 permits a voluntary undertaking at any stage and section 33(2) makes prompt, effective mitigation an express factor in reducing quantum. Readiness here is not a compliance obligation in itself; it is what determines the cost of everything else going wrong."}],"controls":[{"id":"APP-01","domain":"APP","title":"Territorial and material applicability assessed","obligation":"The Act applies to processing of digital personal data within India, and to processing outside India where it is in connection with any activity related to offering goods or services to Data Principals within India. The entity must have determined, and be able to explain, why the Act applies to it and to which processing activities.","act_ref":"s.3(a), s.3(b), DPDP Act, 2023","audit_question":"Has the entity documented a reasoned applicability assessment covering both India-based processing and any offshore processing connected with offering goods or services into India? Does it correctly treat personal data collected in non-digital form and subsequently digitised as in scope?","test_procedure":"Inspect the applicability assessment; enquire of legal/privacy owner; corroborate against the entity's actual product footprint and entity structure.","evidence_expected":["Written applicability assessment or scoping memorandum, dated and owned","List of legal entities, branches and offshore affiliates that process personal data of individuals in India","Confirmation of treatment of digitised paper records"],"scoring":{"0":"No applicability assessment exists. Scope has never been formally determined.","2":"An informal or partial view exists, typically covering the India entity only, with offshore processing or digitised records unaddressed.","4":"A documented, dated and reviewed assessment covers all entities and processing activities, correctly addresses extraterritorial reach and digitised records, and is refreshed when the product or entity footprint changes."},"severity":"high","weight":1.2,"rule_slot":null,"penalty_entry":7,"applicability":{},"note":null,"citation_caution":null},{"id":"APP-02","domain":"APP","title":"Role determination — Data Fiduciary versus Data Processor","obligation":"The entity must correctly determine, for each processing activity, whether it acts as a Data Fiduciary (alone or jointly), determining the purpose and means of processing, or as a Data Processor acting on another's behalf.","act_ref":"s.2, DPDP Act, 2023 (definitions of \"Data Fiduciary\", \"Data Processor\" and \"Data Principal\"), read with s.8(1)","audit_question":"Is there an activity-level role mapping? Where the entity claims to be only a Data Processor, does the evidence support that it does not determine purpose or means — including for any analytics, product improvement, model training or marketing it performs on the same data?","test_procedure":"Inspect role mapping; re-perform the determination for a sample of three activities, testing the claim against contracts and actual data use.","evidence_expected":["Activity-level register recording role assumed and the basis for it","Customer or client contracts supporting a processor characterisation","Evidence that no independent purposes are pursued on processor-held data"],"scoring":{"0":"Roles have not been considered, or a single blanket role is asserted across all activities.","2":"Roles are asserted at entity level rather than activity level; processor claims are not evidenced against actual data use.","4":"Roles are determined per activity, documented with reasoning, consistent with contracts and observed data flows, and re-tested when new uses such as model training are introduced."},"severity":"critical","weight":1.3,"rule_slot":null,"penalty_entry":7,"applicability":{},"note":null,"citation_caution":null},{"id":"APP-03","domain":"APP","title":"Exemptions claimed are valid and evidenced","obligation":"Exemptions under section 17 apply only in the circumstances specified. The startup and class-based exemption under section 17(3) operates only in favour of classes of Data Fiduciary actually notified by the Central Government, and covers only the specified provisions.","act_ref":"s.17(1), s.17(2), s.17(3), s.17(4), DPDP Act, 2023","audit_question":"Does the entity claim any exemption? If it claims the section 17(3) route, can it show that it falls within a class actually notified, rather than relying on self-identification as a startup? Is the claim limited to the provisions the exemption actually reaches?","test_procedure":"Inspect the exemption claim and supporting notification; test the scope claimed against the provisions the exemption covers.","evidence_expected":["Written exemption analysis identifying the specific limb relied upon","Evidence of falling within a notified class, where section 17(3) is relied upon","Confirmation that obligations outside the exemption's scope continue to be met"],"scoring":{"0":"An exemption is assumed or asserted with no analysis, or a broad exemption is claimed on the strength of being 'a startup'.","2":"An analysis exists but overstates the exemption's reach, or has not been re-tested against the notified classes.","4":"Either no exemption is claimed, or the claim is narrowly scoped, evidenced against a notified class, and obligations outside its reach are demonstrably still met."},"severity":"high","weight":1.0,"rule_slot":"STARTUP_EXEMPTION_CLASSES","penalty_entry":7,"applicability":{"requires":["claims_exemption"]},"note":null,"citation_caution":null},{"id":"APP-04","domain":"APP","title":"Significant Data Fiduciary exposure assessed","obligation":"The Central Government may notify a Data Fiduciary or class of Data Fiduciaries as Significant, having regard to the volume and sensitivity of personal data processed, risk to the rights of Data Principals, potential effects on the sovereignty and integrity of India, risk to electoral democracy, security of the State and public order.","act_ref":"s.10(1), DPDP Act, 2023","audit_question":"Has the entity assessed its likelihood of designation against the section 10(1) factors, and does it have a plan to stand up section 10(2) capability within a realistic period of being notified?","test_procedure":"Inspect the self-assessment against each statutory factor; enquire as to readiness planning.","evidence_expected":["Self-assessment against each of the section 10(1) factors","Readiness plan for DPO appointment, DPIA, independent audit and algorithmic due diligence","Board or management minute acknowledging the exposure"],"scoring":{"0":"Designation exposure has never been considered.","2":"Exposure is informally recognised but unassessed against the statutory factors, with no readiness plan.","4":"A documented assessment against each factor exists, is periodically refreshed, and a costed readiness plan is approved so that designation would not require a standing start."},"severity":"medium","weight":0.9,"rule_slot":null,"penalty_entry":null,"applicability":{"excluded_if":["is_sdf"]},"note":null,"citation_caution":null},{"id":"APP-05","domain":"APP","title":"Commencement and phasing tracked against the compliance plan","obligation":"Provisions of the Act and the Rules come into force on such dates as are appointed, which may differ across provisions. The entity must know which obligations are presently enforceable and which are forthcoming.","act_ref":"s.1(2), DPDP Act, 2023","audit_question":"Does the entity maintain a current view of which provisions are in force, with its remediation plan sequenced against those dates rather than against an assumption that everything is either live or not yet live?","test_procedure":"Inspect the compliance calendar; corroborate the dates recorded against the commencement notification.","evidence_expected":["Compliance calendar mapping obligations to commencement dates","Remediation plan sequenced against those dates","Evidence of monitoring for further notifications"],"scoring":{"0":"No awareness of phasing; the framework is treated as a single undifferentiated deadline, or as not yet relevant at all.","2":"Phasing is known informally but not reflected in how remediation is sequenced or prioritised.","4":"A maintained calendar tracks each tranche, remediation is sequenced against it, and a named owner monitors for further notifications and Board guidance."},"severity":"high","weight":1.1,"rule_slot":"COMMENCEMENT_PHASING","penalty_entry":null,"applicability":{},"note":null,"citation_caution":null},{"id":"BRC-01","domain":"BRC","title":"Personal data breach correctly defined in internal procedure","obligation":"A personal data breach means any unauthorised processing of personal data or accidental disclosure, acquisition, sharing, use, alteration, destruction or loss of access to personal data that compromises its confidentiality, integrity or availability.","act_ref":"s.2, DPDP Act, 2023 (definition of \"personal data breach\"), read with s.8(6)","audit_question":"Does the internal definition match the statutory one — capturing loss of availability and integrity, accidental internal disclosure, and unauthorised internal access, not merely external attack?","test_procedure":"Inspect the incident procedure definition against the statutory wording; test classification of a sample of past incidents against it.","evidence_expected":["Incident procedure reproducing the statutory definition","Classification criteria distinguishing a personal data breach from other incidents","Sample of past incidents classified against the definition"],"scoring":{"0":"No definition, or one confined to external cyber attack, so availability loss and internal disclosure are never treated as breaches.","2":"The definition is broadly aligned but applied narrowly in practice, with availability incidents and accidental internal disclosure routinely misclassified.","4":"The definition mirrors the statutory scope, classification criteria are documented and applied consistently, and testing of past incidents confirms correct classification."},"severity":"critical","weight":1.3,"rule_slot":null,"penalty_entry":2,"applicability":{},"note":null,"citation_caution":null},{"id":"BRC-02","domain":"BRC","title":"Detection and escalation capability","obligation":"The obligation to intimate a breach presupposes the capability to become aware of it. Detection and internal escalation must be sufficient to bring a breach to the attention of those responsible for notification within the prescribed window.","act_ref":"s.8(5), s.8(6), DPDP Act, 2023","audit_question":"How would the entity learn of a breach, and how quickly would it reach the person accountable for notification — including breaches originating at a processor or reported by a customer or researcher?","test_procedure":"Inspect detection sources and escalation paths; measure escalation time in recent incidents; test the intake route for externally reported breaches.","evidence_expected":["Detection sources including monitoring, processor notification and external reports","Escalation path with defined timescales to the accountable owner","Measured escalation times from recent incidents"],"scoring":{"0":"No defined detection or escalation. A breach would surface incidentally, and there is no route for an outsider to report one.","2":"Detection and escalation exist for internally detected incidents, but processor-originated and externally reported breaches have no defined intake, and escalation time is unmeasured.","4":"Multiple detection sources feed a defined escalation path with timescales that fit inside the notification window, externally reported breaches have a published intake route, and escalation times are measured."},"severity":"critical","weight":1.3,"rule_slot":"BREACH_INTIMATION","penalty_entry":2,"applicability":{},"note":null,"citation_caution":null},{"id":"BRC-03","domain":"BRC","title":"Intimation to the Board in the prescribed form and time","obligation":"In the event of a personal data breach, the Data Fiduciary must give the Board intimation of the breach in such form and manner as may be prescribed.","act_ref":"s.8(6), DPDP Act, 2023","audit_question":"Is the prescribed form, content and timing of intimation to the Board built into the incident runbook, with a pre-drafted template and a named signatory available out of hours?","test_procedure":"Inspect the runbook and notification template against the prescribed requirements; test the availability of the signatory and the submission channel.","evidence_expected":["Runbook step with the prescribed timescale and content requirements","Pre-drafted intimation template covering every prescribed field","Named signatory with an out-of-hours deputy, and a tested submission route"],"scoring":{"0":"No process for intimating the Board. The requirement has not been operationalised.","2":"The runbook references notification but omits the prescribed content fields, or depends on drafting from scratch under time pressure with a single named signatory and no deputy.","4":"A pre-drafted template covers every prescribed field, the timescale is embedded with escalation, the signatory has a deputy, and the submission route has been tested."},"severity":"critical","weight":1.4,"rule_slot":"BREACH_INTIMATION","penalty_entry":2,"applicability":{},"note":null,"citation_caution":"The notification timescale and any initial-versus-detailed reporting split must be confirmed against the notified Rules. This control cannot be scored against a specific deadline until the BREACH_INTIMATION slot is populated."},{"id":"BRC-04","domain":"BRC","title":"Intimation to each affected Data Principal","obligation":"The Data Fiduciary must give intimation of a personal data breach to each affected Data Principal, in such form and manner as may be prescribed.","act_ref":"s.8(6), DPDP Act, 2023","audit_question":"Can the entity identify every affected Data Principal and reach each of them within the prescribed period — including individuals whose only contact detail is stale, and dormant accounts?","test_procedure":"Re-performance: for a hypothetical breach of a defined dataset, require the entity to produce the affected population and demonstrate the notification mechanism at that volume.","evidence_expected":["Capability to derive the affected population from a defined breach scope","Mass notification mechanism tested at realistic volume","Approach for individuals with stale or absent contact details"],"scoring":{"0":"No capability to identify affected individuals or to notify them at scale. The obligation is unaddressed.","2":"The affected population could be derived with manual effort, but there is no tested mass notification capability, and no approach for unreachable individuals.","4":"The affected population can be derived promptly from breach scope, mass notification is tested at realistic volume across channels, and a documented approach covers unreachable individuals."},"severity":"critical","weight":1.4,"rule_slot":"BREACH_INTIMATION","penalty_entry":2,"applicability":{},"note":null,"citation_caution":null},{"id":"BRC-05","domain":"BRC","title":"Breach register and documentation","obligation":"Demonstrating compliance with section 8(6), and relying on mitigation as a factor in the determination of penalty under section 33(2), both require a contemporaneous record of breaches, decisions and actions taken.","act_ref":"s.8(6), s.33(2), DPDP Act, 2023","audit_question":"Is every incident recorded with its classification, the reasoning where it was assessed as not a personal data breach, notification decisions and timings, and remedial action?","test_procedure":"Inspect the breach register for completeness; reconcile against security incident tickets to detect breaches recorded only as technical incidents.","evidence_expected":["Breach register with classification, reasoning, notification record and remediation","Reconciliation against security incident tickets","Documented reasoning where an incident was assessed as not notifiable"],"scoring":{"0":"No breach register. Incidents exist only as technical tickets with no privacy assessment.","2":"A register exists but records outcomes without reasoning, so a decision not to notify cannot be defended after the fact; reconciliation to incident tickets is not performed.","4":"A complete register records classification with reasoning, notification decisions and timings, and remediation, and is reconciled to incident tickets on a defined cycle."},"severity":"high","weight":1.2,"rule_slot":null,"penalty_entry":2,"applicability":{},"note":null,"citation_caution":null},{"id":"BRC-06","domain":"BRC","title":"Breach response rehearsed and post-incident remediation tracked","obligation":"Section 33(2) makes the promptness, effectiveness and timeliness of mitigating action an express factor in determining the quantum of any penalty, which makes tested response capability directly material to exposure.","act_ref":"s.8(6), s.33(2), DPDP Act, 2023","audit_question":"Has the breach response been rehearsed within the last twelve months against a scenario involving notification to the Board and to Data Principals, and were the lessons tracked to closure?","test_procedure":"Inspect rehearsal records and after-action reports; test whether identified deficiencies were remediated.","evidence_expected":["Tabletop or simulation records including a notification-triggering scenario","After-action report with identified deficiencies and owners","Evidence of deficiencies remediated and retested"],"scoring":{"0":"The breach response has never been rehearsed.","2":"A rehearsal has occurred but did not exercise the notification decision or the mass-notification mechanism, or lessons were recorded without follow-through.","4":"Rehearsals occur at least annually against notification-triggering scenarios, exercise both Board and Data Principal intimation, and after-action items are tracked to closure and retested."},"severity":"high","weight":1.1,"rule_slot":null,"penalty_entry":2,"applicability":{},"note":null,"citation_caution":null},{"id":"BRD-01","domain":"BRD","title":"Capability to respond to a Board inquiry","obligation":"The Board may, on receipt of a complaint or on reference, inquire into a breach and may require the production of information. An entity must be able to respond within the timescales the Board sets.","act_ref":"s.27, s.28, s.36, DPDP Act, 2023","audit_question":"Is there a defined procedure for receiving and responding to a communication from the Board, with a named owner, legal involvement and the ability to assemble evidence at short notice?","test_procedure":"Inspect the procedure and named owner; test evidence assembly by requiring production of a defined evidence set within a short deadline.","evidence_expected":["Documented procedure for handling Board communications with a named owner","Evidence repository enabling rapid assembly of compliance artefacts","Legal and communications escalation arrangements"],"scoring":{"0":"No procedure. A communication from the Board would be handled improvised.","2":"A procedure exists but evidence is dispersed across teams and systems, so assembling a coherent response would take weeks.","4":"A defined procedure with a named owner is supported by an organised evidence repository, and testing confirms a complete evidence set can be assembled at short notice."},"severity":"medium","weight":1.0,"rule_slot":"BOARD_PROCEEDINGS","penalty_entry":null,"applicability":{},"note":null,"citation_caution":null},{"id":"BRD-02","domain":"BRD","title":"Awareness of voluntary undertaking and mitigation as penalty factors","obligation":"The Board may accept a voluntary undertaking at any stage after receipt of a complaint, and in determining the quantum of a penalty must have regard to factors including the promptness, effectiveness and timeliness of mitigating action taken.","act_ref":"s.32, s.33(2), DPDP Act, 2023","audit_question":"Do those who would manage an enforcement matter understand the voluntary undertaking mechanism and the section 33(2) mitigation factors, so that decisions in the first days of an incident are taken with exposure in mind?","test_procedure":"Enquire of legal and privacy leadership; inspect any playbook addressing enforcement strategy and mitigation documentation.","evidence_expected":["Playbook or briefing covering voluntary undertakings and mitigation factors","Practice of contemporaneously documenting mitigating action during incidents","Evidence of legal involvement from the outset of incidents"],"scoring":{"0":"Neither mechanism is understood; mitigation is not documented contemporaneously.","2":"Awareness exists among legal counsel but is not reflected in incident practice, so mitigating action is reconstructed after the fact rather than recorded as taken.","4":"Enforcement strategy is documented and understood, mitigating action is recorded contemporaneously during incidents, and legal is engaged from the outset."},"severity":"low","weight":0.8,"rule_slot":null,"penalty_entry":null,"applicability":{},"note":null,"citation_caution":null},{"id":"BRD-03","domain":"BRD","title":"Remediation plan owned, funded and tracked","obligation":"Accountability under section 8(1), together with the treatment of mitigation as a factor in penalty determination, requires that known gaps be subject to a plan that is actually resourced and progressed.","act_ref":"s.8(1), s.33(2), DPDP Act, 2023","audit_question":"Are identified compliance gaps captured in a single plan with named owners, dates and funding, and is progress reported and enforced — or does the plan exist as a document that no one is measured against?","test_procedure":"Inspect the remediation plan and progress reporting; test a sample of items for evidence of actual progress against the recorded dates.","evidence_expected":["Consolidated remediation plan with owners, dates, funding and status","Progress reporting to the governance forum","Evidence of items completed and of overdue items escalated"],"scoring":{"0":"No consolidated plan. Gaps are known informally and progressed opportunistically.","2":"A plan exists with owners and dates but is not funded, or dates slip repeatedly without escalation or replanning.","4":"A funded plan with named owners and dates is reported to governance, completions are evidenced, and overdue items are escalated and replanned deliberately."},"severity":"high","weight":1.1,"rule_slot":null,"penalty_entry":null,"applicability":{},"note":null,"citation_caution":null},{"id":"CHD-01","domain":"CHD","title":"Age determination and identification of child users","obligation":"A child means an individual who has not completed eighteen years of age. Obligations in relation to children attach to the processing of a child's personal data, which presupposes the ability to identify such data.","act_ref":"s.2, DPDP Act, 2023 (definition of \"child\"), read with s.9(1)","audit_question":"How does the entity determine whether a user is under eighteen? Is the threshold set at eighteen rather than at a lower age imported from another jurisdiction, and is there a response where age is unknown or misstated?","test_procedure":"Inspect the age determination mechanism and the threshold configured; test the treatment of users of unknown age and the response to indications of misstatement.","evidence_expected":["Age determination mechanism with the threshold set at eighteen","Documented treatment of users whose age is unknown","Procedure for responding to signals that age was misstated"],"scoring":{"0":"Age is not determined at all, or the threshold is set below eighteen following another jurisdiction's standard.","2":"Age is collected and the threshold is correct, but self-declaration is accepted with no response to contrary signals, and users of unknown age default to adult treatment.","4":"The threshold is eighteen, age determination is supported by proportionate signals rather than bare self-declaration, unknown-age users receive a documented default, and misstatement signals trigger review."},"severity":"critical","weight":1.3,"rule_slot":"CHILD_CONSENT_VERIFICATION","penalty_entry":3,"applicability":{"requires":["processes_children_data"]},"note":null,"citation_caution":null},{"id":"CHD-02","domain":"CHD","title":"Verifiable consent of parent or lawful guardian","obligation":"Before processing any personal data of a child, or of a person with a disability who has a lawful guardian, the Data Fiduciary must obtain verifiable consent of the parent or of such lawful guardian.","act_ref":"s.9(1), DPDP Act, 2023","audit_question":"Is parental consent verifiable — with due diligence establishing that the consenting adult is identifiable and is in fact the parent or guardian — rather than a tickbox asserting parental status?","test_procedure":"Re-performance: complete the child onboarding journey and assess what verification is actually performed; inspect the artefacts retained.","evidence_expected":["Verification mechanism establishing the adult's identity and their relationship to the child","Consent artefacts linking parent identity to the specific child record","Records demonstrating processing does not begin before consent is obtained"],"scoring":{"0":"No parental consent is obtained, or a self-declared checkbox asserting parental status is treated as sufficient.","2":"A parental consent flow exists and captures an adult's details, but verification does not establish identity or the parental relationship, and processing sometimes begins before consent completes.","4":"Verification establishes both the adult's identity and the guardian relationship through proportionate means, artefacts link parent to child record, and processing demonstrably does not begin until consent is complete."},"severity":"critical","weight":1.4,"rule_slot":"CHILD_CONSENT_VERIFICATION","penalty_entry":3,"applicability":{"requires":["processes_children_data"]},"note":null,"citation_caution":null},{"id":"CHD-03","domain":"CHD","title":"No tracking, behavioural monitoring or targeted advertising to children","obligation":"A Data Fiduciary must not undertake tracking or behavioural monitoring of children, or targeted advertising directed at children.","act_ref":"s.9(3), DPDP Act, 2023","audit_question":"Are tracking, behavioural profiling and targeted advertising technically disabled for users identified as children — including third-party tags, advertising SDKs and analytics that profile behaviour?","test_procedure":"Re-performance: instrument a child-flagged test account and inspect outbound requests, cookies, SDK activity and advertising identifiers.","evidence_expected":["Technical suppression of tracking, profiling and ad targeting for child accounts","Test evidence from a child-flagged account showing no profiling calls","Contractual and technical controls over advertising and analytics SDKs"],"scoring":{"0":"Children are tracked and targeted identically to adults; no suppression exists.","2":"Advertising targeting is suppressed but behavioural analytics, personalisation or third-party SDKs continue to profile child users, or suppression is policy-based rather than technically enforced.","4":"Tracking, behavioural monitoring and targeted advertising are technically suppressed for child accounts across first and third-party components, verified by instrumented testing."},"severity":"critical","weight":1.4,"rule_slot":"CHILD_EXEMPT_CLASSES","penalty_entry":3,"applicability":{"requires":["processes_children_data"]},"note":"This prohibition is not curable by consent. Parental consent does not authorise tracking or targeted advertising directed at a child.","citation_caution":null},{"id":"CHD-04","domain":"CHD","title":"No processing likely to cause detrimental effect on a child's wellbeing","obligation":"A Data Fiduciary must not undertake processing of personal data that is likely to cause any detrimental effect on the wellbeing of a child.","act_ref":"s.9(2), DPDP Act, 2023","audit_question":"Has the entity assessed whether any processing affecting children is likely to have a detrimental effect on their wellbeing — including engagement optimisation, recommendation systems and features designed to extend session time?","test_procedure":"Inspect wellbeing impact assessments for child-affecting features; test whether engagement-optimising mechanics were assessed and, where necessary, modified.","evidence_expected":["Wellbeing impact assessment covering features and algorithms affecting children","Assessment of engagement mechanics, recommendation systems and notification design","Evidence of features modified or withheld on wellbeing grounds"],"scoring":{"0":"No assessment of detrimental effect has been undertaken.","2":"Content safety is addressed but the wellbeing effects of engagement optimisation, recommendations and notification design have not been assessed.","4":"Documented wellbeing assessments cover features and algorithms affecting children, are reviewed on change, and there is evidence of design changes made on wellbeing grounds."},"severity":"high","weight":1.2,"rule_slot":null,"penalty_entry":3,"applicability":{"requires":["processes_children_data"]},"note":null,"citation_caution":null},{"id":"CHD-05","domain":"CHD","title":"Persons with disability having a lawful guardian","obligation":"The requirement of verifiable consent extends to the personal data of a person with a disability who has a lawful guardian, with consent to be obtained from that guardian.","act_ref":"s.9(1), DPDP Act, 2023","audit_question":"Is there a mechanism for guardian consent where a Data Principal has a lawful guardian, including verification of the guardianship and a route for a guardian to identify themselves and act?","test_procedure":"Inspect the guardian consent mechanism and verification approach; test the route by which a guardian can come forward.","evidence_expected":["Guardian consent capture and verification mechanism","Published route for a guardian to identify themselves and exercise rights","Records linking guardian to the Data Principal"],"scoring":{"0":"No mechanism exists; the obligation in respect of persons with disability has not been considered.","2":"Guardian consent is handled case by case on request, with no defined verification approach or published route.","4":"A defined mechanism captures and verifies guardianship, a published route lets guardians come forward, and records link guardian to Data Principal and support rights exercise."},"severity":"high","weight":1.1,"rule_slot":"CHILD_CONSENT_VERIFICATION","penalty_entry":3,"applicability":{},"note":null,"citation_caution":null},{"id":"CMG-01","domain":"CMG","title":"Consent Manager relied upon is registered with the Board","obligation":"A Data Principal may give, manage, review and withdraw consent through a Consent Manager, which must be registered with the Board and must act on behalf of and be accountable to the Data Principal.","act_ref":"s.6(7), s.6(8), DPDP Act, 2023","audit_question":"Where consent is received via a Consent Manager, has the entity verified that intermediary's registration with the Board, and does it re-verify periodically?","test_procedure":"Inspect verification records against the Board's register of Consent Managers; enquire as to the re-verification cycle.","evidence_expected":["Registration verification evidence for each Consent Manager relied upon","Contractual terms addressing registration status and notification of change","Periodic re-verification records"],"scoring":{"0":"A Consent Manager is relied upon with no verification of registration status.","2":"Registration was verified at onboarding but is not re-verified, and the contract is silent on loss of registration.","4":"Registration is verified at onboarding and periodically thereafter, the contract requires immediate notification of any change in status, and a contingency exists for withdrawal of registration."},"severity":"high","weight":1.2,"rule_slot":"CONSENT_MANAGER_REGISTRATION","penalty_entry":7,"applicability":{"requires":["uses_consent_manager"]},"note":null,"citation_caution":null},{"id":"CMG-02","domain":"CMG","title":"Consent Manager interface integrity and record reconciliation","obligation":"Reliance on a Consent Manager does not displace the Data Fiduciary's own accountability under section 8(1) or its burden of proof under section 6(10).","act_ref":"s.6(7), s.6(10), s.8(1), DPDP Act, 2023","audit_question":"Are consent records received from the Consent Manager reconciled against the entity's own processing, so that a withdrawal registered with the intermediary reliably reaches and halts the entity's systems?","test_procedure":"Re-performance: register a withdrawal through the Consent Manager and trace propagation into the entity's systems; inspect reconciliation controls and exception handling.","evidence_expected":["Integration design and reconciliation controls between the intermediary and internal consent state","Exception reports for failed or delayed synchronisation","End-to-end test evidence for a withdrawal originating at the intermediary"],"scoring":{"0":"No reconciliation. The entity assumes the intermediary's records are authoritative and acts only when notified.","2":"Reconciliation is periodic and manual, with synchronisation failures detected late or not at all.","4":"Automated reconciliation with exception alerting is in place, withdrawal propagation is tested end to end, and the entity retains its own provable consent state."},"severity":"high","weight":1.1,"rule_slot":"CONSENT_MANAGER_OBLIGATIONS","penalty_entry":7,"applicability":{"requires":["uses_consent_manager"]},"note":null,"citation_caution":null},{"id":"CMG-03","domain":"CMG","title":"Own registration and obligations where acting as a Consent Manager","obligation":"An entity acting as a Consent Manager must be registered with the Board, subject to prescribed conditions, and must discharge the obligations of that role including accountability to the Data Principal.","act_ref":"s.6(8), s.6(9), DPDP Act, 2023","audit_question":"If the entity itself acts as a Consent Manager, is it registered, does it meet the prescribed conditions on a continuing basis, and can it evidence accountability to Data Principals rather than to the Data Fiduciaries paying it?","test_procedure":"Inspect registration, continuing compliance with prescribed conditions, and the operational independence of the Data Principal-facing function.","evidence_expected":["Certificate or evidence of registration with the Board","Continuing compliance monitoring against the prescribed conditions","Governance evidencing accountability to Data Principals, including conflict management"],"scoring":{"0":"Operating as a Consent Manager without registration, or without having assessed whether the role is being performed.","2":"Registered, but continuing compliance with prescribed conditions is not monitored, and accountability to Data Principals is asserted rather than evidenced.","4":"Registered, with continuing compliance actively monitored, and demonstrable governance — including conflict-of-interest management — establishing accountability to Data Principals."},"severity":"critical","weight":1.2,"rule_slot":"CONSENT_MANAGER_OBLIGATIONS","penalty_entry":7,"applicability":{"requires":["is_consent_manager"]},"note":null,"citation_caution":null},{"id":"CON-01","domain":"CON","title":"Consent is free, specific, informed, unconditional and unambiguous","obligation":"Consent must be free, specific, informed, unconditional and unambiguous with a clear affirmative action, signifying agreement to processing of the personal data for the specified purpose.","act_ref":"s.6(1), DPDP Act, 2023","audit_question":"Does each consent involve a clear affirmative action — no pre-ticked boxes, no consent inferred from continued use, no consent bundled across unrelated purposes into a single acceptance?","test_procedure":"Observation and re-performance: complete each consent journey and record the mechanism; inspect the stored artefact to confirm it reflects an affirmative act.","evidence_expected":["Consent interface showing unticked, separate, affirmative controls","Absence of consent inferred from silence, inactivity or continued use","Separate consent per distinct purpose"],"scoring":{"0":"Consent is bundled, pre-ticked, or inferred from continued use of the service.","2":"Affirmative action is required for an overall acceptance, but purposes remain bundled so the Data Principal cannot agree to one and decline another.","4":"Each distinct purpose has its own unticked affirmative control, no consent is inferred from inactivity, and the stored artefact records which specific purposes were agreed."},"severity":"critical","weight":1.4,"rule_slot":"CONSENT_REQUEST_FORM","penalty_entry":7,"applicability":{},"note":null,"citation_caution":null},{"id":"CON-02","domain":"CON","title":"Consent not conditioned on service where data is unnecessary","obligation":"Consent extends only to personal data necessary for the specified purpose, and is invalid to the extent it purports to go further. Consent conditioned on provision of unnecessary data is not free.","act_ref":"s.6(1), s.6(2), DPDP Act, 2023","audit_question":"Is access to the service made conditional on consent to processing that is not necessary for delivering it — marketing, profiling, enrichment or data sharing presented as unavoidable?","test_procedure":"Re-performance: attempt to complete onboarding declining every non-essential consent, and record whether the service remains usable.","evidence_expected":["Evidence that the service functions when non-essential consents are declined","Analysis distinguishing necessary from optional processing per service","Absence of dark patterns making refusal disproportionately difficult"],"scoring":{"0":"Service access requires blanket consent covering unnecessary processing; declining is not possible.","2":"Some granularity exists but at least one non-essential purpose remains effectively mandatory, or refusal is made disproportionately difficult through interface design.","4":"Testing confirms the service is fully usable when every non-essential consent is declined, refusal is as easy as acceptance, and the necessary/optional split is documented."},"severity":"critical","weight":1.3,"rule_slot":null,"penalty_entry":7,"applicability":{},"note":null,"citation_caution":null},{"id":"CON-03","domain":"CON","title":"Consent request in clear and plain language with contact details","obligation":"Every request for consent must be presented in clear and plain language, giving the option to access it in English or an Eighth Schedule language, and must provide the contact details of the Data Protection Officer or other person authorised to respond on the Data Fiduciary's behalf.","act_ref":"s.6(3), DPDP Act, 2023","audit_question":"Is the consent request written in plain language accessible to a general audience, and does it carry the required contact details at the point of request rather than only deep in a policy?","test_procedure":"Inspect consent text for readability and for contact details; assess against a plain-language standard.","evidence_expected":["Consent request text with contact details present at the point of request","Readability assessment or plain-language review record","Language options available at the point of request"],"scoring":{"0":"Consent text is dense legal drafting with no contact details at the point of request.","2":"Language is partially simplified but retains legal or technical formulations, or contact details appear only by onward link.","4":"Consent text is demonstrably plain, reviewed against a readability standard, carries contact details in-line, and offers language options at the point of request."},"severity":"high","weight":1.1,"rule_slot":"CONSENT_REQUEST_FORM","penalty_entry":7,"applicability":{},"note":null,"citation_caution":null},{"id":"CON-04","domain":"CON","title":"Withdrawal of consent as easy as giving it","obligation":"The Data Principal has the right to withdraw consent at any time, and the ease of doing so must be comparable to the ease with which consent was given.","act_ref":"s.6(4), DPDP Act, 2023","audit_question":"Can consent be withdrawn through the same channel and with comparable effort to giving it — a self-service control where consent was given in-app — or does withdrawal require an email, a call, or navigating to an obscure setting?","test_procedure":"Re-performance: withdraw consent through each available route, counting steps and elapsed time, and compare against the steps to give it.","evidence_expected":["Self-service withdrawal control on the same surface as collection","Step-count comparison between giving and withdrawing","Evidence of withdrawals actually processed end to end"],"scoring":{"0":"No withdrawal mechanism, or withdrawal only by writing to a general inbox where consent was given in one click.","2":"A withdrawal route exists but is materially harder than giving consent — more steps, a different channel, or a manual handoff introducing delay.","4":"Withdrawal is available on the same surface with comparable effort, tested end to end, and the step-count comparison is documented."},"severity":"critical","weight":1.3,"rule_slot":null,"penalty_entry":7,"applicability":{},"note":null,"citation_caution":null},{"id":"CON-05","domain":"CON","title":"Consequences of withdrawal disclosed and borne by the Data Principal","obligation":"The Data Principal bears the consequences of withdrawal of consent, and those consequences must be made known. Withdrawal does not affect the legality of processing carried out before it.","act_ref":"s.6(5), s.6(6), DPDP Act, 2023","audit_question":"Are the consequences of withdrawal explained accurately at the point of withdrawal — neither understated nor exaggerated into a deterrent?","test_procedure":"Inspect withdrawal interface text; assess whether stated consequences are accurate and proportionate rather than discouraging.","evidence_expected":["Withdrawal interface text describing actual consequences","Verification that stated consequences match what technically follows","Absence of deterrent framing or exaggerated warnings"],"scoring":{"0":"Consequences are not disclosed at all, or withdrawal silently degrades the service.","2":"Consequences are disclosed but inaccurately or in deterrent terms designed to discourage withdrawal.","4":"Consequences are accurately and neutrally stated, verified against what technically occurs, and free of deterrent framing."},"severity":"medium","weight":1.0,"rule_slot":null,"penalty_entry":7,"applicability":{},"note":null,"citation_caution":null},{"id":"CON-06","domain":"CON","title":"Processing ceases within a reasonable time of withdrawal","obligation":"On withdrawal of consent, the Data Fiduciary must, within a reasonable time, cease processing the personal data unless such processing without consent is required or authorised by law, and must cause its Data Processors to cease as well.","act_ref":"s.6(6), DPDP Act, 2023","audit_question":"How long after withdrawal does processing actually stop, across all systems including analytics, marketing platforms, warehouses and processors — and is that interval measured rather than assumed?","test_procedure":"Re-performance: withdraw consent for a test record and trace it across every downstream system, measuring elapsed time to cessation in each.","evidence_expected":["Measured cessation times across primary, secondary and vendor systems","Propagation mechanism from the consent store to downstream consumers","Exception log for systems where cessation is delayed or manual"],"scoring":{"0":"Withdrawal is recorded but processing continues; there is no propagation to downstream systems.","2":"Cessation occurs in primary systems but downstream platforms — marketing tools, warehouses, processors — continue processing until a periodic sync, with the interval unmeasured.","4":"Withdrawal propagates to every consumer including processors within a measured and documented interval, exceptions are logged and owned, and tracing a test record confirms end-to-end cessation."},"severity":"critical","weight":1.3,"rule_slot":null,"penalty_entry":7,"applicability":{},"note":null,"citation_caution":null},{"id":"CON-07","domain":"CON","title":"Consent artefacts retained and provable","obligation":"Where a question arises as to whether notice was given and consent obtained in accordance with the Act, the Data Fiduciary bears the burden of proving it.","act_ref":"s.6(10), DPDP Act, 2023","audit_question":"For a given Data Principal, can the entity produce a tamper-evident record of what was consented to, when, through what interface, and against which version of the notice?","test_procedure":"Re-performance: select three Data Principals at random and require production of the full consent artefact including notice version and interface reference.","evidence_expected":["Consent records capturing timestamp, purpose set, interface, notice version","Tamper-evidence or immutability controls over the consent store","Successful retrieval for randomly selected individuals"],"scoring":{"0":"No consent records are retained, or only a boolean flag with no purpose, timestamp or notice version.","2":"Records exist with timestamp and purpose but omit the notice version or interface, so the artefact cannot be tied to what was actually presented.","4":"Complete, tamper-evident artefacts capture purpose set, timestamp, interface and notice version, are retrievable on demand for any individual, and testing confirms retrieval."},"severity":"critical","weight":1.4,"rule_slot":null,"penalty_entry":7,"applicability":{},"note":null,"citation_caution":nul
