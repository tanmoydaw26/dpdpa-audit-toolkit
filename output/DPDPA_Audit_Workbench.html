l},{"id":"CON-08","domain":"CON","title":"Consent refresh on material change of purpose","obligation":"Consent is specific to the purpose for which it was given. A material change in purpose requires fresh notice and fresh consent; it cannot be effected by amending a policy.","act_ref":"s.5(1), s.6(1), DPDP Act, 2023","audit_question":"When purposes change materially, is fresh consent obtained — or is the change implemented by updating the privacy policy and treating continued use as acceptance?","test_procedure":"Inspect the change history of purposes and the corresponding consent events; test whether recent material changes triggered re-consent.","evidence_expected":["Change log of processing purposes with materiality assessment","Re-consent campaigns tied to material changes","Evidence that continued use is not treated as consent to new purposes"],"scoring":{"0":"Purpose changes are effected by policy update alone; continued use is treated as consent.","2":"Material changes are recognised and sometimes trigger re-consent, but the materiality test is undocumented and applied inconsistently.","4":"A documented materiality test governs whether re-consent is required, is consistently applied with evidence of re-consent campaigns, and continued use is never treated as agreement to new purposes."},"severity":"high","weight":1.2,"rule_slot":null,"penalty_entry":7,"applicability":{},"note":null,"citation_caution":null},{"id":"GOV-01","domain":"GOV","title":"Accountability for compliance, including processor activity","obligation":"A Data Fiduciary is responsible for complying with the Act in respect of any processing undertaken by it or on its behalf by a Data Processor, notwithstanding any agreement to the contrary or the Data Principal's failure to carry out their duties.","act_ref":"s.8(1), DPDP Act, 2023","audit_question":"Is there a named, senior accountable owner for DPDPA compliance whose remit expressly extends to processing carried out by processors, with sufficient authority and resourcing to act?","test_procedure":"Inspect the appointment and remit; enquire of the owner as to authority, budget and escalation path; corroborate with governance minutes.","evidence_expected":["Written appointment recording name, role and remit","Governance forum terms of reference and minutes evidencing oversight","Evidence of resourcing and of escalation to senior management or the board"],"scoring":{"0":"No named owner. Accountability is diffuse or assumed to sit with IT or with an offshore group function that has no India mandate.","2":"An owner is named but the remit excludes processor activity, or the role lacks authority, budget or a reporting line into senior management.","4":"A senior owner is formally appointed with an express remit covering processors, reports periodically to a governance forum or the board, and can evidence decisions actually taken under that authority."},"severity":"critical","weight":1.3,"rule_slot":null,"penalty_entry":7,"applicability":{},"note":null,"citation_caution":null},{"id":"GOV-02","domain":"GOV","title":"Record of processing activities maintained","obligation":"Although the Act does not name a register in terms, the burden of demonstrating consent under section 6(10) and the accountability duty under section 8(1) cannot be discharged without a reliable record of what personal data is processed, for what purpose, on what basis, and with whom it is shared.","act_ref":"s.6(10), s.8(1), DPDP Act, 2023 (evidential requirement)","audit_question":"Is there a complete, current record of processing activities capturing data categories, purposes, lawful basis, retention, recipients, processors and cross-border flows? Is it reconciled to reality rather than maintained as a one-off documentation exercise?","test_procedure":"Inspect the register; test completeness by selecting two systems not obviously covered and tracing them; test currency against recent product changes.","evidence_expected":["Record of processing activities with the fields above","Evidence of periodic review with dates and reviewer","Reconciliation to a system or application inventory"],"scoring":{"0":"No record exists, or a partial spreadsheet exists that has not been updated since creation.","2":"A register exists and covers major systems, but is incomplete at the edges — shadow systems, analytics stacks and vendor-hosted data are missing — and is not reconciled to an application inventory.","4":"A complete register is reconciled to the application inventory, refreshed on a defined cycle and on material change, and demonstrably drives downstream artefacts such as notices and retention rules."},"severity":"critical","weight":1.3,"rule_slot":null,"penalty_entry":7,"applicability":{},"note":null,"citation_caution":null},{"id":"GOV-03","domain":"GOV","title":"Publication of DPO or contact person details","obligation":"A Data Fiduciary must publish the business contact information of the Data Protection Officer, if applicable, or of a person able to answer on its behalf the questions of a Data Principal about the processing of their personal data.","act_ref":"s.8(8), DPDP Act, 2023","audit_question":"Are contact details published in a place a Data Principal would actually find them, and does a real, monitored channel sit behind them that is capable of answering substantive questions about processing?","test_procedure":"Inspect the published details on all customer-facing surfaces; re-perform by sending a substantive processing question through the channel and measuring the response.","evidence_expected":["Screenshots of published contact details on website, app and other surfaces","Evidence of channel monitoring and ownership","Sample of substantive questions received and answered"],"scoring":{"0":"No contact details are published, or only a generic support form with no privacy routing.","2":"Details are published but buried, inconsistent across surfaces, or route to an unmonitored mailbox or a team unable to answer processing questions.","4":"Details are prominently and consistently published across all surfaces, the channel is monitored with defined ownership and service levels, and testing shows substantive questions are answered competently."},"severity":"high","weight":1.0,"rule_slot":"DP_CONTACT_PUBLICATION","penalty_entry":7,"applicability":{},"note":null,"citation_caution":null},{"id":"GOV-04","domain":"GOV","title":"Board and senior management oversight","obligation":"Accountability under section 8(1) requires oversight proportionate to the risk. For a Significant Data Fiduciary the Data Protection Officer is expressly required to be responsible to the board of directors or similar governing body, which sets the expected standard of engagement.","act_ref":"s.8(1), s.10(2)(a), DPDP Act, 2023","audit_question":"Does the board or an equivalent governing body receive periodic reporting on data protection risk, breaches, rights-request volumes and remediation progress, and is there evidence of it directing action?","test_procedure":"Inspect minutes and reporting packs for the last four cycles; test whether reported issues were tracked to closure.","evidence_expected":["Board or committee minutes referencing data protection matters","Management information pack showing metrics reported","Evidence of decisions taken and tracked to closure"],"scoring":{"0":"No reporting to senior management or the board.","2":"Ad hoc or incident-driven reporting only, with no defined cycle, metrics or follow-through on issues raised.","4":"Periodic reporting on a defined cycle with meaningful metrics, evidenced challenge from the forum, and issues tracked to closure."},"severity":"medium","weight":1.0,"rule_slot":null,"penalty_entry":null,"applicability":{},"note":null,"citation_caution":null},{"id":"GOV-05","domain":"GOV","title":"Policies, standards and internal procedures","obligation":"Appropriate technical and organisational measures under section 8(4) include the documented policies and procedures by which the entity gives effect to its obligations.","act_ref":"s.8(4), DPDP Act, 2023","audit_question":"Is there an approved policy set covering notice, consent, rights handling, retention, breach response, vendor management and children's data, mapped to the Act, version-controlled and actually reflected in operational procedure?","test_procedure":"Inspect the policy set and approval records; test one policy against the operational procedure and system behaviour it purports to govern.","evidence_expected":["Approved policy set with version history and approver","Mapping of policies to Act provisions","Operational procedures or runbooks referenced by the policies"],"scoring":{"0":"No DPDPA-specific policies. A generic IT or global privacy policy is relied upon without India mapping.","2":"Policies exist but are unmapped to the Act, out of date, or demonstrably not followed in practice — the classic gap between an imported group policy and local operation.","4":"An approved, version-controlled, Act-mapped policy set is in force, supported by operational runbooks, and testing confirms practice follows the documented procedure."},"severity":"medium","weight":1.0,"rule_slot":null,"penalty_entry":7,"applicability":{},"note":null,"citation_caution":null},{"id":"GOV-06","domain":"GOV","title":"Training and awareness","obligation":"Organisational measures under section 8(4) extend to ensuring that personnel handling personal data understand their obligations, particularly those operating consent, rights and breach processes.","act_ref":"s.8(4), DPDP Act, 2023","audit_question":"Have personnel in roles that touch personal data received DPDPA-specific training, with role-tailored content for high-risk functions such as support, marketing, engineering and procurement, and is completion tracked?","test_procedure":"Inspect training content and completion records; enquire of a sample of staff in high-risk roles to test practical understanding.","evidence_expected":["Training material specific to the Act, not generic privacy content","Completion records by role with dates","Role-specific modules for support, marketing, engineering and procurement"],"scoring":{"0":"No training on the Act has been delivered.","2":"Generic annual privacy training only, with no DPDPA content, no role tailoring and incomplete completion tracking.","4":"Act-specific training is delivered to all relevant personnel with role-tailored modules for high-risk functions, completion is tracked and enforced, and sample enquiry confirms practical understanding."},"severity":"medium","weight":0.9,"rule_slot":null,"penalty_entry":null,"applicability":{},"note":null,"citation_caution":null},{"id":"GOV-07","domain":"GOV","title":"Evidence retention for demonstrating compliance","obligation":"Where consent is relied upon, the Data Fiduciary bears the burden of proving that notice was given and consent was obtained in accordance with the Act. This requires retention of the underlying artefacts, not merely of the current policy.","act_ref":"s.6(10), DPDP Act, 2023","audit_question":"Can the entity produce, for a Data Principal selected at random, the notice text as presented at the time, the consent artefact, and the processing history — or can it only produce today's policy?","test_procedure":"Re-perform: select two Data Principals at random and require production of the historical notice version, consent artefact and processing record.","evidence_expected":["Versioned archive of notice and consent text with effective dates","Consent artefacts retrievable per Data Principal","Documented evidence retention period aligned to limitation and inquiry risk"],"scoring":{"0":"Only the current policy exists. Historical notice versions and consent artefacts are not retained or not retrievable.","2":"Some artefacts are retained but cannot be reliably reconstructed per individual, or historical notice versions are missing so the artefact cannot be tied to what was actually shown.","4":"Notice versions and consent artefacts are archived and jointly retrievable per Data Principal, and testing confirms the entity can reconstruct precisely what was presented and agreed to, and when."},"severity":"critical","weight":1.2,"rule_slot":null,"penalty_entry":7,"applicability":{},"note":null,"citation_caution":null},{"id":"GRV-01","domain":"GRV","title":"Effective grievance redressal mechanism established","obligation":"A Data Fiduciary must establish an effective mechanism to redress the grievances of Data Principals.","act_ref":"s.8(9), DPDP Act, 2023","audit_question":"Is there a dedicated grievance mechanism that is reachable, staffed and capable of resolving substantive data protection complaints — as distinct from a general customer support queue?","test_procedure":"Inspect the mechanism design and staffing; re-perform by lodging a substantive grievance and following it to resolution.","evidence_expected":["Documented grievance procedure with defined ownership and escalation","Evidence of staffing and of competence to resolve data protection matters","Test grievance followed end to end with outcome recorded"],"scoring":{"0":"No grievance mechanism, or complaints are routed into general support with no privacy competence or escalation.","2":"A mechanism exists but is under-resourced, lacks escalation, or resolves matters superficially without addressing the underlying processing issue.","4":"A dedicated, resourced mechanism with defined ownership and escalation resolves matters substantively, and end-to-end testing confirms effectiveness."},"severity":"high","weight":1.2,"rule_slot":null,"penalty_entry":7,"applicability":{},"note":null,"citation_caution":null},{"id":"GRV-02","domain":"GRV","title":"Response within the prescribed period","obligation":"A Data Principal has the right to readily available means of grievance redressal, and the Data Fiduciary must respond to a grievance within such period as may be prescribed.","act_ref":"s.13(1), s.13(2), DPDP Act, 2023","audit_question":"Is the prescribed response period known, configured into the workflow as a service level, and met in practice — with performance measured rather than asserted?","test_procedure":"Inspect service level configuration and performance data; test a sample of closed grievances for actual elapsed time.","evidence_expected":["Service level configured to the prescribed period with automated escalation","Performance data showing distribution of response times","Root-cause analysis for overruns"],"scoring":{"0":"No service level. Response times are neither targeted nor measured.","2":"A service level exists but is internally chosen rather than aligned to the prescribed period, and performance is measured only in aggregate.","4":"The service level matches the prescribed period, is enforced by automated escalation, performance is measured at request level, and overruns are root-caused."},"severity":"high","weight":1.2,"rule_slot":"GRIEVANCE_RESPONSE_PERIOD","penalty_entry":7,"applicability":{},"note":null,"citation_caution":null},{"id":"GRV-03","domain":"GRV","title":"Grievance mechanism readily available and publicised","obligation":"The means of grievance redressal must be readily available to the Data Principal, who must exhaust the opportunity so provided before approaching the Board.","act_ref":"s.13(1), s.13(3), DPDP Act, 2023","audit_question":"Can a Data Principal find the grievance route without difficulty from any surface on which they interact with the entity, and is it published alongside the section 8(8) contact details?","test_procedure":"Observation: attempt to locate the grievance route as a naive user from each surface, recording steps required.","evidence_expected":["Grievance route published on website, app, notice and communications","Step count to locate the route from each surface","Consistency of the route published across surfaces"],"scoring":{"0":"The grievance route is not published; a Data Principal could not find it.","2":"It is published but hard to locate, or inconsistent across surfaces so different channels give different routes.","4":"The route is prominently and consistently published on every surface, discoverable in a small number of steps, and aligned with the published contact details."},"severity":"medium","weight":1.0,"rule_slot":null,"penalty_entry":7,"applicability":{},"note":null,"citation_caution":null},{"id":"GRV-04","domain":"GRV","title":"Grievance trend analysis feeding remediation","obligation":"An effective mechanism under section 8(9) implies more than case handling: the entity must be capable of identifying and addressing the systemic causes that generate grievances.","act_ref":"s.8(9), DPDP Act, 2023","audit_question":"Are grievances categorised and analysed for root cause, with systemic issues escalated into the remediation plan rather than each case being closed in isolation?","test_procedure":"Inspect grievance categorisation and trend reporting; test whether identified systemic issues resulted in a change.","evidence_expected":["Categorisation taxonomy and trend reports","Root-cause analyses for recurring categories","Evidence of process or system changes traceable to grievance trends"],"scoring":{"0":"Grievances are closed individually with no categorisation or analysis.","2":"Volumes are reported but not root-caused, so recurring issues persist across periods without structural fix.","4":"Grievances are categorised and root-caused, trends are reported to the governance forum, and there is evidence of systemic changes made in response."},"severity":"low","weight":0.8,"rule_slot":null,"penalty_entry":null,"applicability":{},"note":null,"citation_caution":null},{"id":"LGU-01","domain":"LGU","title":"Legitimate use relied upon is a specific statutory limb","obligation":"Processing without consent is permitted only for the certain legitimate uses enumerated in section 7. The list is closed; there is no general balancing or legitimate-interests ground.","act_ref":"s.7, DPDP Act, 2023","audit_question":"For every activity proceeding without consent, is the specific section 7 limb identified and defensible — and has the entity avoided importing a legitimate-interests analysis from another regime?","test_procedure":"Inspect the basis register; re-perform the analysis for each legitimate use relied upon, testing the fit against the statutory wording.","evidence_expected":["Identification of the specific limb, by sub-clause, for each activity","Written analysis of why the activity falls within it","Absence of reliance on a general balancing test"],"scoring":{"0":"Processing proceeds without consent on an unstated basis, or on a legitimate-interests rationale that has no counterpart in the Act.","2":"A limb is cited but the analysis is thin or strained, stretching the provision to cover commercially convenient processing.","4":"Each reliance cites a specific sub-clause with a documented, defensible analysis, reviewed by legal, and reliance is narrowly confined to what the limb actually authorises."},"severity":"critical","weight":1.3,"rule_slot":null,"penalty_entry":7,"applicability":{},"note":null,"citation_caution":null},{"id":"LGU-02","domain":"LGU","title":"Employment-purposes limb correctly scoped","obligation":"Processing is a legitimate use where it is necessary for purposes of employment, or those related to safeguarding the employer from loss or liability, such as prevention of corporate espionage, maintenance of confidentiality of trade secrets or intellectual property, or provision of any service or benefit sought by an employee.","act_ref":"s.7(i), DPDP Act, 2023","audit_question":"Where employee data is processed under section 7(i), is each use necessary for employment or for safeguarding against loss or liability — and does the entity avoid treating the limb as blanket authority for all employee monitoring?","test_procedure":"Inspect employee data processing inventory; test each monitoring or analytics use against the necessity standard in the limb.","evidence_expected":["Inventory of employee data processing with the limb mapped per use","Necessity analysis for monitoring, productivity analytics and surveillance","Employee-facing transparency documentation"],"scoring":{"0":"All employee data processing is assumed lawful without analysis by virtue of the employment relationship.","2":"The limb is mapped at a high level but intrusive uses — location tracking, communications monitoring, productivity scoring — are not individually justified against the necessity standard.","4":"Each use is mapped to the limb with a documented necessity analysis, intrusive monitoring is separately justified and proportionate, and employees are informed."},"severity":"high","weight":1.2,"rule_slot":null,"penalty_entry":7,"applicability":{"requires":["processes_employee_data"]},"note":null,"citation_caution":null},{"id":"LGU-03","domain":"LGU","title":"Voluntary provision limb not over-extended","obligation":"Processing is a legitimate use where the Data Principal has voluntarily provided personal data for a specified purpose and has not indicated objection, but only for that purpose.","act_ref":"s.7(a), DPDP Act, 2023","audit_question":"Where the voluntary-provision limb is relied upon, is processing confined to the specific purpose for which the data was volunteered, and is there a working mechanism for the Data Principal to object?","test_procedure":"Inspect the activities relying on this limb; test whether processing extends beyond the volunteered purpose and whether objection is operable.","evidence_expected":["Identification of the purpose for which data was volunteered, per activity","Controls confining processing to that purpose","Operable objection mechanism with evidence of objections honoured"],"scoring":{"0":"The limb is used as a general basis for processing data the individual happened to provide, with no purpose confinement and no objection route.","2":"Purpose is identified but confinement is weak — volunteered data flows into marketing or analytics — or the objection mechanism is undocumented.","4":"Processing is technically and procedurally confined to the volunteered purpose, an operable objection mechanism exists, and objections are evidenced as honoured."},"severity":"medium","weight":1.0,"rule_slot":null,"penalty_entry":7,"applicability":{},"note":null,"citation_caution":null},{"id":"NOT-01","domain":"NOT","title":"Notice accompanies or precedes every consent request","obligation":"Every request for consent must be accompanied or preceded by a notice informing the Data Principal of the personal data to be processed and the purpose of processing.","act_ref":"s.5(1)(i), DPDP Act, 2023","audit_question":"At every consent collection point, is a notice presented at or before the moment of consent — as distinct from a hyperlink to a privacy policy sitting beside a pre-ticked box?","test_procedure":"Observation: walk every consent journey — web, app, offline, telephonic, partner-led — and record what is presented at the moment of consent.","evidence_expected":["Screenshots or recordings of each consent journey showing notice placement","Inventory of all consent collection points including offline and partner channels","Notice text as presented, not merely the policy it links to"],"scoring":{"0":"No notice at the point of consent; reliance on a privacy policy link or on nothing at all.","2":"Notice is present on primary digital journeys but absent or inadequate on secondary channels — offline forms, call centre scripts, partner-led onboarding.","4":"A compliant notice is presented at or before consent on every channel, with an inventory demonstrating completeness and periodic re-walking of journeys to confirm."},"severity":"critical","weight":1.3,"rule_slot":"NOTICE_CONTENT","penalty_entry":7,"applicability":{},"note":null,"citation_caution":null},{"id":"NOT-02","domain":"NOT","title":"Notice content — itemised data and specified purpose","obligation":"The notice must inform the Data Principal of the personal data proposed to be processed and the purpose of such processing.","act_ref":"s.5(1)(i), DPDP Act, 2023","audit_question":"Does the notice itemise the actual categories of personal data and state specific purposes, or does it use open-ended formulations such as \"information you provide\" and \"to improve our services\"?","test_procedure":"Inspect notice text against the processing register; test whether every category and purpose in the register appears in the notice and vice versa.","evidence_expected":["Notice text with itemised data categories and specific purposes","Reconciliation of notice content to the processing register","Absence of catch-all purpose language"],"scoring":{"0":"Notice is generic, describing neither specific data categories nor specific purposes.","2":"Principal categories and purposes are described but catch-all language remains, or the notice does not reconcile to the processing register.","4":"Notice itemises data categories and states each purpose specifically, reconciles to the register in both directions, and is updated when processing changes."},"severity":"critical","weight":1.3,"rule_slot":"NOTICE_CONTENT","penalty_entry":7,"applicability":{},"note":null,"citation_caution":null},{"id":"NOT-03","domain":"NOT","title":"Notice explains rights and the route to the Board","obligation":"The notice must inform the Data Principal of the manner in which they may exercise their rights to withdraw consent and to grievance redressal, and of the manner in which a complaint may be made to the Data Protection Board.","act_ref":"s.5(1)(ii), s.5(1)(iii), DPDP Act, 2023","audit_question":"Does the notice explain, in operative terms, how to withdraw consent, how to seek grievance redressal, and how to complain to the Board — including the fact that the grievance mechanism must be exhausted first?","test_procedure":"Inspect notice text for each of the three disclosures; test that the mechanisms described actually work as stated.","evidence_expected":["Notice text covering withdrawal, grievance redressal and complaint to the Board","Working links or contact routes for each","Consistency between what the notice describes and the operative mechanism"],"scoring":{"0":"None of the three disclosures is made.","2":"Rights are mentioned in general terms but the manner of exercise is not operative — no working link, no address, or a described route that does not function.","4":"All three are disclosed with operative, tested routes, and the notice correctly explains the sequencing of grievance redressal before approach to the Board."},"severity":"high","weight":1.2,"rule_slot":"NOTICE_CONTENT","penalty_entry":7,"applicability":{},"note":null,"citation_caution":null},{"id":"NOT-04","domain":"NOT","title":"Notice available in English and Eighth Schedule languages","obligation":"The Data Principal must be given the option to access the notice in English or any language specified in the Eighth Schedule to the Constitution of India.","act_ref":"s.5(3), DPDP Act, 2023","audit_question":"Is the notice actually available in English and in Eighth Schedule languages, with a discoverable language selector — and are the translations accurate rather than machine-rendered approximations of legal effect?","test_procedure":"Observation: locate and exercise the language option on each surface; inspect translation provenance and review process.","evidence_expected":["Notice published in English plus Eighth Schedule languages","Discoverable language selection mechanism on each surface","Translation review or certification records"],"scoring":{"0":"Notice is available in English only, or in English plus an unreviewed machine translation.","2":"Some languages are offered but coverage is partial, the selector is hard to find, or translations are unreviewed machine output.","4":"The option is genuinely available and discoverable across surfaces, translations are reviewed for legal accuracy, and version control keeps every language aligned when the notice changes."},"severity":"medium","weight":1.0,"rule_slot":"NOTICE_CONTENT","penalty_entry":7,"applicability":{},"note":null,"citation_caution":null},{"id":"NOT-05","domain":"NOT","title":"Retrospective notice for pre-commencement consent","obligation":"Where personal data is processed on the basis of consent given before the commencement of the Act, the Data Fiduciary must, as soon as reasonably practicable, give the Data Principal a notice compliant with the Act's requirements. Processing may continue until consent is withdrawn.","act_ref":"s.5(2), DPDP Act, 2023","audit_question":"Has the entity identified its pre-commencement consent population and issued compliant retrospective notice to it, with evidence of despatch and of handling the withdrawals that follow?","test_procedure":"Inspect the identified population and despatch evidence; test a sample of records for whether notice was in fact issued and what followed.","evidence_expected":["Identification of the pre-commencement Data Principal population","Notice content issued retrospectively and despatch records","Handling of withdrawals arising from the exercise"],"scoring":{"0":"The pre-commencement population has not been identified and no retrospective notice has been issued.","2":"The population is identified and notice issued to part of it, with gaps for dormant records or channels where contact details are stale.","4":"The full population is identified, compliant notice is evidenced as despatched, coverage gaps are documented with rationale, and resulting withdrawals were processed and evidenced."},"severity":"high","weight":1.1,"rule_slot":"NOTICE_CONTENT","penalty_entry":7,"applicability":{"requires":["has_pre_commencement_data"]},"note":null,"citation_caution":null},{"id":"PRO-01","domain":"PRO","title":"Complete inventory of Data Processors and onward recipients","obligation":"A Data Fiduciary remains responsible for compliance in respect of processing undertaken on its behalf by a Data Processor, and must be able to disclose to a Data Principal the identities of all Data Fiduciaries and Data Processors with whom personal data has been shared.","act_ref":"s.8(1), s.11(1)(b), DPDP Act, 2023","audit_question":"Is there a complete inventory of processors and other recipients, including sub-processors, marketing and analytics platforms, and tools procured outside formal procurement on a corporate card?","test_procedure":"Inspect the inventory; test completeness against accounts payable, expense data and outbound network or SaaS discovery.","evidence_expected":["Processor and recipient inventory recording data shared and purpose","Sub-processor visibility for each principal processor","Reconciliation against payables or SaaS discovery to find unmanaged tools"],"scoring":{"0":"No inventory. The entity cannot state who holds its personal data.","2":"An inventory covers contracted processors but omits sub-processors and tools acquired outside procurement, and has not been reconciled against payables.","4":"A complete inventory, reconciled against payables or discovery tooling, records data shared and purpose for every recipient and maintains sub-processor visibility."},"severity":"critical","weight":1.3,"rule_slot":null,"penalty_entry":7,"applicability":{},"note":null,"citation_caution":null},{"id":"PRO-02","domain":"PRO","title":"Valid contract in place with every Data Processor","obligation":"A Data Fiduciary may engage, appoint, use or otherwise involve a Data Processor to process personal data on its behalf only under a valid contract.","act_ref":"s.8(2), DPDP Act, 2023","audit_question":"Does every processor have a current, executed contract covering personal data processing — and are there processors operating on expired agreements, purchase orders alone, or click-through terms never reviewed?","test_procedure":"Inspect contracts for a sample of processors from the inventory; test currency of execution and completeness of data protection terms.","evidence_expected":["Executed contracts for every processor in the inventory","Data protection terms addressing purpose limitation, safeguards, erasure, breach and sub-processing","Contract currency tracking with renewal alerts"],"scoring":{"0":"Processors operate without contracts, or on purchase orders with no data protection terms.","2":"Most processors are contracted but a material number rely on expired agreements or unreviewed click-through terms, and coverage of the required terms is inconsistent.","4":"Every processor in the inventory has a current executed contract with complete data protection terms, tracked for currency with renewal alerts, and exceptions are escalated."},"severity":"critical","weight":1.4,"rule_slot":null,"penalty_entry":7,"applicability":{},"note":null,"citation_caution":null},{"id":"PRO-03","domain":"PRO","title":"Safeguards, erasure and breach obligations flowed down","obligation":"The Data Fiduciary's duties to protect personal data and to cause erasure extend to data held by processors, which requires those duties to be reflected in the contract and given effect operationally.","act_ref":"s.8(1), s.8(5), s.8(7), DPDP Act, 2023","audit_question":"Do processor contracts require security safeguards at least equivalent to the entity's own, prompt breach notification within a window that allows the entity to meet its own deadline, and erasure on instruction and at termination?","test_procedure":"Inspect contract clauses for each requirement; test whether the processor breach notification window is shorter than the entity's own obligation.","evidence_expected":["Clauses mandating equivalent safeguards, audit or assurance rights","Breach notification window shorter than the entity's own notification deadline","Erasure and return obligations on instruction and at termination"],"scoring":{"0":"Contracts are silent on safeguards, breach notification and erasure.","2":"Clauses exist but the processor notification window equals or exceeds the entity's own deadline — making compliance arithmetically impossible — or erasure at termination is unaddressed.","4":"Contracts mandate equivalent safeguards with assurance rights, require notification within a window that leaves the entity time to notify, and impose erasure on instruction and at termination."},"severity":"critical","weight":1.3,"rule_slot":"SECURITY_SAFEGUARDS","penalty_entry":1,"applicability":{},"note":null,"citation_caution":null},{"id":"PRO-04","domain":"PRO","title":"Sub-processor control and authorisation","obligation":"Because responsibility under section 8(1) is not displaced by sub-contracting, onward engagement by a processor must be controlled and the same obligations must flow down the chain.","act_ref":"s.8(1), s.8(2), DPDP Act, 2023","audit_question":"Do contracts require authorisation or notification before a sub-processor is engaged, require equivalent flow-down, and does the entity maintain visibility of the current sub-processor list?","test_procedure":"Inspect sub-processing clauses; test current sub-processor lists for a sample of processors against what the entity holds.","evidence_expected":["Sub-processing authorisation or objection rights in contracts","Flow-down obligation to sub-processors","Current sub-processor lists obtained and reviewed"],"scoring":{"0":"Sub-processing is unrestricted and the entity has no visibility of who else holds the data.","2":"Contracts require notification but the entity does not track or review sub-processor lists in practice, so visibility is nominal.","4":"Authorisation or objection rights are contractual, flow-down is required, current sub-processor lists are obtained and reviewed, and changes are assessed."},"severity":"high","weight":1.1,"rule_slot":null,"penalty_entry":7,"applicability":{},"note":null,"citation_caution":null},{"id":"PRO-05","domain":"PRO","title":"Processor assurance and monitoring","obligation":"Retaining responsibility for a processor's processing implies an obligation to satisfy oneself, on a continuing basis, that the processor is in fact meeting the required standard.","act_ref":"s.8(1), s.8(5), DPDP Act, 2023","audit_question":"Is processor compliance verified through due diligence at onboarding and periodic assurance thereafter — proportionate to risk — or does verification end at contract signature?","test_procedure":"Inspect due diligence and periodic assurance records for high-risk processors; test whether identified deficiencies were pursued.","evidence_expected":["Risk-tiered due diligence at onboarding","Periodic assurance: certifications reviewed, questionnaires, audits or site visits","Evidence of deficiencies identified and pursued to resolution"],"scoring":{"0":"No due diligence or ongoing assurance. Processors are trusted on the strength of the contract.","2":"Onboarding due diligence occurs but there is no periodic reassessment, or certifications are collected without being read or reconciled to the services actually used.","4":"Risk-tiered due diligence at onboarding is followed by periodic assurance, certification scope is checked against services used, and deficiencies are pursued to resolution."},"severity":"high","weight":1.1,"rule_slot":null,"penalty_entry":7,"applicability":{},"note":null,"citation_caution":null},{"id":"PRO-06","domain":"PRO","title":"Exit, transition and return or erasure on termination","obligation":"The erasure duty extends to data made available to processors, which makes the treatment of data at the end of the relationship a compliance matter rather than a commercial one.","act_ref":"s.8(7), DPDP Act, 2023","audit_question":"On termination, is personal data returned or erased, with written confirmation obtained — and does the entity actually pursue this for terminated vendors rather than allowing the relationship to lapse?","test_procedure":"Inspect a sample of terminated processor relationships for erasure or return confirmations; test the exit procedure.","evidence_expected":["Exit procedure requiring return or erasure and written confirmation","Erasure confirmations for recently terminated processors","Register of terminated relationships with erasure status"],"scoring":{"0":"No exit procedure. Terminated vendors retain data indefinitely and no confirmation is sought.","2":"The procedure exists contractually but is not enforced in practice; confirmations are missing for most terminated relationships.","4":"Every termination triggers a documented return or erasure step, written confirmations are obtained and retained, and a register tracks status to closure."},"severity":"high","weight":1.1,"rule_slot":null,"penalty_entry":7,"applicability":{},"note":null,"citation_caution":null},{"id":"PUR-01","domain":"PUR","title":"Every processing activity has an identified lawful basis","obligation":"Personal data may be processed only for a lawful purpose for which the Data Principal has given consent, or for a certain legitimate use. A lawful purpose is one not expressly forbidden by law.","act_ref":"s.4(1), s.4(2), DPDP Act, 2023","audit_question":"Is a specific lawful basis — consent or a named section 7 legitimate use — recorded for every processing activity in the register, with no activity left unmapped or resting on a basis that does not exist under the Act?","test_procedure":"Inspect basis mapping for completeness; re-perform the determination for a sample of five activities, including at least one marketing and one analytics use.","evidence_expected":["Lawful basis recorded per activity in the processing register","Reasoning for each legitimate use relied upon, citing the specific limb","Evidence that no activity relies on a ground absent from the Act"],"scoring":{"0":"Lawful basis has not been mapped, or is asserted only at policy level.","2":"Basis is mapped for core activities but secondary uses such as analytics, personalisation, model training or marketing are unmapped or rest on an imported ground such as legitimate interests.","4":"Every activity carries a specific, documented and defensible basis citing the exact provision, reviewed on change, with no reliance on grounds the Act does not contain."},"severity":"critical","weight":1.3,"rule_slot":null,"penalty_entry":7,"applicability":{},"note":null,"citation_caution":null},{"id":"PUR-02","domain":"PUR","title":"Data minimisation — collection limited to what is necessary","obligation":"Consent signifies agreement to processing of only such personal data as is necessary for the specified purpose, and any part of consent that purports to extend beyond that is invalid to that extent.","act_ref":"s.6(1), s.6(2), DPDP Act, 2023","audit_question":"For each collection point, is every field necessary for the stated purpose? Are optional fields distinguished from mandatory ones, and has any field been challenged and removed as a result of review?","test_procedure":"Inspect a sample of collection forms and API payloads field by field against stated purposes; test whether mandatory fields are genuinely necessary.","evidence_expected":["Field-level necessity analysis for principal collection points","Distinction between mandatory and optional fields in the interface","Change records showing fields removed following review"],"scoring":{"0":"No necessity analysis. Forms collect whatever has accumulated historically.","2":"Necessity is asserted at purpose level but not tested field by field; some fields are collected because a system requires them or because they may prove useful later.","4":"Field-level necessity is documented and periodically re-tested, optional fields are clearly distinguished, and there is evidence of fields having actually been removed as unnecessary."},"severity":"high","weight":1.2,"rule_slot":null,"penalty_entry":7,"applicability":{},"note":null,"citation_caution":null},{"id":"PUR-03","domain":"PUR","title":"Purpose limitation — no undisclosed secondary use","obligation":"Processing must be for the specified purpose for which consent was given. Personal data may not be repurposed for materially different uses without a fresh lawful basis.","act_ref":"s.4(1), s.5(1), s.6(1), DPDP Act, 2023","audit_question":"Are there controls preventing personal data collected for one purpose being used for another — particularly transaction data flowing into marketing, or customer data into model training — and is a fresh basis obtained where the purpose is materially new?","test_procedure":"Inspect data flows from primary systems into analytics, marketing and machine-learning environments; test each against the notice given at collection.","evidence_expected":["Data flow documentation from collection into secondary environments","Purpose-compatibility assessments for secondary uses","Evidence of fresh notice and consent where purposes were materially extended"],"scoring":{"0":"Data moves freely between purposes with no assessment. Analytics and marketing draw on whatever is available.","2":"Secondary uses are recognised and partially assessed, but at least one material use — commonly model training or enrichment — proceeds beyond the notice given.","4":"Secondary use is gated by documented compatibility assessment, technically constrained where possible, and fresh notice and consent are obtained for materially new purposes with evidence of the gate having been enforced."},"severity":"high","weight":1.2,"rule_slot":null,"penalty_entry":7,"applicability":{},"note":null,"citation_caution":null},{"id":"PUR-04","domain":"PUR","title":"Accuracy and completeness where data drives decisions or is shared","obligation":"Where personal data is likely to be used to make a decision affecting the Data Principal, or is likely to be disclosed to another Data Fiduciary, the Data Fiduciary must ensure it is complete, accurate and consistent.","act_ref":"s.8(3), DPDP Act, 2023","audit_question":"Has the entity identified which processing produces decisions affecting Data Principals or involves disclosure onward, and what controls assure accuracy, completeness and consistency in those specific flows?","test_procedure":"Inspect the inventory of decisioning and disclosure flows; test accuracy controls including validation, reconciliation and correction propagation in a sample flow.","evidence_expected":["Inventory of decision-making and onward-disclosure flows","Data quality controls: validation rules, reconciliation, exception handling","Evidence that corrections propagate to downstream recipients and decisions"],"scoring":{"0":"Decisioning and disclosure flows have not been identified; no accuracy controls specific to them.","2":"Flows are known and general data quality controls exist, but corrections do not reliably propagate to downstream recipients or to decisions already made.","4":"Decisioning and disclosure flows are inventoried, subject to defined accuracy and consistency controls, and corrections demonstrably propagate downstream with evidence of exception handling."},"severity":"high","weight":1.1,"rule_slot":null,"penalty_entry":7,"applicability":{"excluded_if":["startup_exempt_s8_3"]},"note":null,"citation_caution":null},{"id":"PUR-05","domain":"PUR","title":"Privacy considered at design stage for new processing","obligation":"Appropriate technical and organisational measures under section 8(4) require that new products, features and vendor engagements are assessed for compliance before personal data is processed, not after.","act_ref":"s.8(4), DPDP Act, 2023","audit_question":"Is there a gate in the product and procurement lifecycle requiring privacy assessment before launch, and is there evidence of it having actually blocked or changed a launch?","test_procedure":"Inspect the gate definition and completed assessments; test a sample of recent launches for whether the gate was applied before go-live.","evidence_expected":["Defined assessment gate in the product and procurement lifecycle","Completed assessments for recent launches, dated before go-live","Evidence of at least one launch changed or blocked as a result"],"scoring":{"0":"No assessment gate. Privacy is considered after launch, if at all.","2":"A gate exists on paper but is routinely bypassed under delivery pressure, or assessments are completed retrospectively to close the record.","4":"The gate is embedded and enforced before go-live, with completed assessments predating launch and evidence of launches having been changed or blocked on privacy grounds."},"severity":"medium","weight":1.0,"rule_slot":null,"penalty_entry":null,"applicability":{},"note":null,"citation_caution":null},{"id":"RET-01","domain":"RET","title":"Retention schedule defined per data category and purpose","obligation":"Personal data must be erased on withdrawal of consent or as soon as it is reasonable to assume the specified purpose is no longer being served, whichever is earlier, unless retention is necessary for compliance with law.","act_ref":"s.8(7), DPDP Act, 2023","audit_question":"Is there a retention schedule stating, per data category and purpose, how long data is kept and on what legal footing — with retention beyond purpose justified by a specific legal requirement rather than by general prudence?","test_procedure":"Inspect the retention schedule against the processing register; test the stated legal basis for each retention period exceeding the purpose.","evidence_expected":["Retention schedule mapped to data categories and purposes","Specific statutory or regulatory citation for each extended retention period","Approval and periodic review records"],"scoring":{"0":"No retention schedule. Data is retained indefinitely by default.","2":"A schedule exists for principal categories but extended retention rests on unspecified 'legal and regulatory requirements' without citation, or omits secondary stores entirely.","4":"A complete schedule covers every category and purpose, each extended period cites the specific legal requirement, and the schedule is reviewed and approved on a defined cycle."},"severity":"high","weight":1.2,"rule_slot":"RETENTION_ERASURE_PERIODS","penalty_entry":7,"applicability":{},"note":null,"citation_caution":null},{"id":"RET-02","domain":"RET","title":"Erasure on withdrawal of consent or purpose completion","obligation":"On withdrawal of consent or once the purpose is no longer being served, the Data Fiduciary must erase the personal data, unless retention is necessary for compliance with any law.","act_ref":"s.8(7), DPDP Act, 2023","audit_question":"Is erasure actually triggered and completed on withdrawal or purpose completion — and is it erasure, as distinct from a soft-delete flag that leaves the record fully intact and queryable?","test_procedure":"Re-performance: withdraw consent for a test record, then query every store directly to confirm the data is gone rather than flagged.","evidence_expected":["Automated erasure triggers tied to withdrawal and purpose-completion events","Evidence from direct queries that data is removed, not merely flagged","Erasure logs recording what was erased and when"],"scoring":{"0":"No erasure occurs. Records persist indefinitely after withdrawal.","2":"Erasure is implemented as a soft-delete or status flag, leaving data present and accessible, or runs only as an unmonitored manual periodic job.","4":"Erasure is automatically triggered, verified by direct query across stores, logged, and exceptions where law requires retention are individually documented."},"severity":"critical","weight":1.3,"rule_slot":"RETENTION_ERASURE_PERIODS","penalty_entry":7,"applicability":{"excluded_if":["startup_exempt_s8_7"]},"note":null,"citation_caution":null},{"id":"RET-03","domain":"RET","title":"Erasure propagated to processors, backups and derived stores","obligation":"The Data Fiduciary must cause its Data Processors to erase personal data that was made available to them for processing.","act_ref":"s.8(7), DPDP Act, 2023","audit_question":"Does erasure reach processors, data warehouses, analytics environments, search indices, caches, logs and backups — and is completion confirmed rather than assumed?","test_procedure":"Trace an erasure request across the full data topology; inspect processor erasure confirmations; test the treatment of backups and derived datasets.","evidence_expected":["Data topology map identifying every store holding personal data","Processor erasure instructions and written confirmations of completion","Documented approach to backups, including erasure on restore"],"scoring":{"0":"Erasure is confined to the primary system. Processors and secondary stores are not addressed.","2":"Processors are instructed but completion is not confirmed, and derived stores — warehouses, indices, logs — are missed or handled inconsistently.","4":"A complete topology drives erasure across every store, processors return confirmations that are tracked, and the backup approach is documented including re-erasure on restore."},"severity":"critical","weight":1.3,"rule_slot":"RETENTION_ERASURE_PERIODS","penalty_entry":7,"applicability":{},"note":null,"citation_caution":null},{"id":"RET-04","domain":"RET","title":"Deemed purpose completion on Data Principal inactivity","obligation":"The purpose is deemed no longer to be served if the Data Principal neither approaches the Data Fiduciary for the performance of the purpose nor exercises any of their rights in relation to it, for such period as may be prescribed.","act_ref":"s.8(10), DPDP Act, 2023","audit_question":"Does the entity track Data Principal inactivity and treat the prescribed period of inactivity as triggering erasure — and does it know whether it falls within a class for which specific periods are prescribed?","test_procedure":"Inspect inactivity tracking and the erasure trigger; test the class determination against the prescribed thresholds; sample dormant records for erasure.","evidence_expected":["Inactivity definition and tracking mechanism per data category","Class determination assessment against the prescribed thresholds","Erasure records for dormant populations"],"scoring":{"0":"Inactivity is not tracked. Dormant records are retained indefinitely.","2":"Inactivity is tracked for some populations but no erasure trigger is wired to it, or the entity has not determined whether prescribed class-based periods apply to it.","4":"Inactivity is tracked per category, the class determination is documented, erasure triggers operate on the prescribed period, and dormant-population erasure is evidenced."},"severity":"high","weight":1.1,"rule_slot":"RETENTION_ERASURE_PERIODS","penalty_entry":7,"applicability":{},"note":null,"citation_caution":null},{"id":"RET-05","domain":"RET","title":"Advance notice before erasure where required","obligation":"The Rules are understood to require advance intimation to the Data Principal before erasure on the expiry of a prescribed retention period, so that the individual may act to preserve access if they wish.","act_ref":"s.8(7), s.8(10) read with the Rules, DPDP Act, 2023","audit_question":"Where a prescribed retention period is about to expire, is advance notice given to the Data Principal in the prescribed manner and within the prescribed period before erasure?","test_procedure":"Inspect the pre-erasure notification mechanism and despatch logs; test that timing precedes erasure by the required interval.","evidence_expected":["Pre-erasure notification template and trigger configuration","Despatch logs showing notice preceding erasure by the required interval","Handling of Data Principal responses to such notices"],"scoring":{"0":"No pre-erasure notification capability exists.","2":"Notification is possible but manual, inconsistently applied, or sent without a controlled interval before erasure.","4":"Pre-erasure notification is automated on the prescribed interval, despatch is logged, and responses are handled through a defined process."},"severity":"medium","weight":0.9,"rule_slot":"RETENTION_ERASURE_PERIODS","penalty_entry":7,"applicability":{},"note":null,"citation_caution":"The existence and length of the advance-notice period, and the classes to which it applies, must be confirmed against the notified Rules before this control is reported as a contravention rather than a readiness gap."},{"id":"RGT-01","domain":"RGT","title":"Right to access information about personal data","obligation":"A Data Principal who has previously given consent is entitled, on request, to a summary of the personal data being processed and the processing activities undertaken, the identities of all other Data Fiduciaries and Data Processors with whom the personal data has been shared together with a description of the data shared, and any other prescribed information.","act_ref":"s.11(1), DPDP Act, 2023","audit_question":"Can the entity produce, on request, a summary of the data held, the processing activities, and the identities of every recipient with a description of what was shared? The recipient-identity element is the part most commonly absent.","test_procedure":"Re-performance: submit an access request as a Data Principal and evaluate the completeness of the response against the statutory requirements.","evidence_expected":["Access request procedure and fulfilment records","Sample response demonstrating all three statutory elements","Mechanism for compiling recipient identities and data shared"],"scoring":{"0":"No access mechanism. Requests are handled ad hoc or not at all.","2":"A summary of data held can be produced, but processing activities or recipient identities and shared-data descriptions are omitted or incomplete.","4":"Testing confirms responses cover all statutory elements including full recipient identities and descriptions of data shared, produced within the prescribed period through a repeatable process."},"severity":"high","weight":1.2,"rule_slot":"RIGHTS_REQUEST_HANDLING","penalty_entry":7,"applicability":{"excluded_if":["startup_exempt_s11"]},"note":null,"citation_caution":null},{"id":"RGT-02","domain":"RGT","title":"Right to correction, completion and updating","obligation":"A Data Principal has the right to correction, completion and updating of personal data. On receiving such a request the Data Fiduciary must correct inaccurate or misleading data, complete incomplete data, and update it.","act_ref":"s.12(1), s.12(2), DPDP Act, 2023","audit_question":"Can a Data Principal have data corrected, completed and updated, and do those corrections propagate to processors and to other Data Fiduciaries with whom the data was shared?","test_procedure":"Re-performance: submit a correction request and trace propagation to downstream systems and third-party recipients.","evidence_expected":["Correction procedure and fulfilment records with elapsed times","Evidence of propagation to processors and onward recipients","Self-service correction capability where practicable"],"scoring":{"0":"No correction mechanism exists.","2":"Corrections are made in the primary system but do not propagate to processors, downstream systems or prior recipients.","4":"Corrections are actioned within the prescribed period and demonstrably propagate to every downstream consumer and prior recipient, with self-service available where practicable."},"severity":"high","weight":1.1,"rule_slot":"RIGHTS_REQUEST_HANDLING","penalty_entry":7,"applicability":{},"note":null,"citation_caution":null},{"id":"RGT-03","domain":"RGT","title":"Right to erasure on request","obligation":"A Data Principal has the right to erasure of personal data, and on such a request the Data Fiduciary must erase unless retention is necessary for the specified purpose or for compliance with any law.","act_ref":"s.12(3), DPDP Act, 2023","audit_question":"Is erasure on request actioned across all stores, with refusals confined to genuine legal retention requirements and explained to the Data Principal?","test_procedure":"Re-performance: submit an erasure request and verify removal across stores; inspect the refusal log and test the justifications recorded.","evidence_expected":["Erasure request procedure and fulfilment records","Verification of removal across all identified stores","Refusal log with specific legal justification per refusal"],"scoring":{"0":"Erasure requests are not actioned, or are refused as a matter of course.","2":"Requests are actioned in the primary system only, or refusals cite general business need rather than a specific legal retention requirement.","4":"Erasure is actioned and verified across all stores within the prescribed period, and each refusal cites a specific legal basis and is communicated to the Data Principal."},"severity":"high","weight":1.2,"rule_slot":"RIGHTS_REQUEST_HANDLING","penalty_entry":7,"applicability":{},"note":null,"citation_caution":null},{"id":"RGT-04","domain":"RGT","title":"Right to nominate","obligation":"A Data Principal has the right to nominate, in the prescribed manner, any other individual to exercise their rights under the Act in the event of the Data Principal's death or incapacity.","act_ref":"s.14, DPDP Act, 2023","audit_question":"Is there a working mechanism for a Data Principal to nominate another individual, and a procedure for that nominee to be verified and to exercise rights when the trigger event occurs?","test_procedure":"Inspect the nomination mechanism and the nominee verification procedure; test that nomination records are retrievable and actionable.","evidence_expected":["Nomination capture mechanism accessible to Data Principals","Nominee verification and rights-exercise procedure","Retrievable nomination records"],"scoring":{"0":"No nomination mechanism exists and the right is not mentioned to Data Principals.","2":"Nomination is accepted informally or by correspondence, with no defined verification procedure for the nominee or trigger-event handling.","4":"A structured nomination mechanism is available and publicised, records are retrievable, and a documented procedure governs nominee verification and rights exercise on death or incapacity."},"severity":"medium","weight":0.9,"rule_slot":"NOMINATION","penalty_entry":7,"applicability":{},"note":null,"citation_caution":null},{"id":"RGT-05","domain":"RGT","title":"Identity verification proportionate and non-obstructive","obligation":"Rights must be exercisable in the prescribed manner. Verification of the requester's identity is legitimate, but requirements that exceed what is necessary operate as an obstruction to the exercise of a statutory right and themselves involve collecting further personal data.","act_ref":"s.11, s.12, s.13 read with s.6(1), DPDP Act, 2023","audit_question":"Is identity verification proportionate to the sensitivity of the request, or does it demand documentation the entity does not already hold — a scanned identity document from a user who registered with an email address?","test_procedure":"Inspect verification requirements per request type; assess proportionality and whether verification collects data beyond what is held.","evidence_expected":["Documented verification standard, tiered by request sensitivity","Evidence that verification uses existing authenticated channels where available","Absence of requirements to submit new identity documents without cause"],"scoring":{"0":"Verification is either absent, creating a security exposure, or so onerous that requests are effectively defeated.","2":"Verification is applied uniformly regardless of request sensitivity, and sometimes requires new identity documentation from already-authenticated users.","4":"Verification is tiered by sensitivity, leverages existing authenticated sessions where available, collects no more than necessary, and is documented and consistently applied."},"severity":"medium","weight":1.0,"rule_slot":"RIGHTS_REQUEST_HANDLING","penalty_entry":7,"applicability":{},"note":null,"citation_caution":null},{"id":"RGT-06","domain":"RGT","title":"Rights request logging, tracking and service levels","obligation":"Demonstrating compliance with rights obligations requires a record of requests received, actions taken and time to completion.","act_ref":"s.8(1), s.11, s.12, s.13, DPDP Act, 2023","audit_question":"Are all rights requests logged in a single register with type, receipt date, action taken and completion date, and is performance against the prescribed period monitored and reported?","test_procedure":"Inspect the register for completeness; reconcile against inbound channels to detect requests received but never logged; test elapsed times.","evidence_expected":["Consolidated rights request register across every inbound channel","Elapsed-time metrics against the prescribed period","Reporting of breaches of service level and their remediation"],"scoring":{"0":"No register. Requests arrive through scattered channels and are handled without record.","2":"A register exists for the dedicated privacy channel but misses requests arriving through support, social media or account managers; elapsed times are not measured.","4":"A single register captures requests from every channel following reconciliation, elapsed times are measured against the prescribed period, and overruns are reported and remediated."},"severity":"high","weight":1.1,"rule_slot":"RIGHTS_REQUEST_HANDLING","penalty_entry":7,"applicability":{},"note":null,"citation_caution":null},{"id":"SDF-01","domain":"SDF","title":"Data Protection Officer appointed and based in India","obligation":"A Significant Data Fiduciary must appoint a Data Protection Officer who is based in India, is responsible to the board of directors or similar governing body, and is the point of contact for the grievance redressal mechanism.","act_ref":"s.10(2)(a), DPDP Act, 2023","audit_question":"Is a DPO appointed who is genuinely based in India, reports to the board rather than through a functional line that could suppress escalation, and is the designated grievance contact?","test_procedure":"Inspect the appointment, reporting line and location; corroborate board reporting through minutes; verify the DPO is the published grievance contact.","evidence_expected":["Appointment letter recording India base, remit and reporting line to the board","Board minutes evidencing direct reporting","Published contact details identifying the DPO as grievance point of contact"],"scoring":{"0":"No DPO appointed, or the role is held by a person outside India.","2":"A DPO is appointed and India-based, but reports through a functional line rather than to the board, or is not the published grievance contact.","4":"An India-based DPO is formally appointed with a reporting line to the board evidenced in minutes, is the published grievance contact, and has resourcing and independence to act."},"severity":"critical","weight":1.4,"rule_slot":null,"penalty_entry":4,"applicability":{"requires":["is_sdf"]},"note":null,"citation_caution":null},{"id":"SDF-02","domain":"SDF","title":"Independent data auditor appointed","obligation":"A Significant Data Fiduciary must appoint an independent data auditor to evaluate its compliance with the provisions of the Act.","act_ref":"s.10(2)(b), DPDP Act, 2023","audit_question":"Is an independent data auditor appointed, with independence genuinely established — not the same firm that designed the compliance programme — and with a scope covering compliance with the Act as a whole?","test_procedure":"Inspect the appointment and engagement scope; assess independence including prior advisory work; review the most recent audit report and management response.","evidence_expected":["Appointment of an independent data auditor with engagement terms","Independence assessment addressing prior or concurrent advisory work","Most recent audit report with management response and remediation tracking"],"scoring":{"0":"No independent data auditor has been appointed.","2":"An auditor is appointed but independence is compromised by concurrent advisory work, or the scope is narrowed to security rather than compliance with the Act.","4":"An independent auditor with documented independence is appointed on a scope covering the Act, reports are issued and considered by the board, and findings are tracked to closure."},"severity":"critical","weight":1.3,"rule_slot":"SDF_DPIA_AUDIT","penalty_entry":4,"applicability":{"requires":["is_sdf"]},"note":null,"citation_caution":null},{"id":"SDF-03","domain":"SDF","title":"Periodic Data Protection Impact Assessment","obligation":"A Significant Data Fiduciary must undertake periodic Data Protection Impact Assessment, being a process comprising a description of the rights of Data Principals, the purpose of processing, assessment and management of risk to those rights, and such other matters as may be prescribed.","act_ref":"s.10(2)(c)(i), DPDP Act, 2023","audit_question":"Are DPIAs conducted periodically and on material change, addressing each statutory element including assessment and management of risk to the rights of Data Principals — and do they drive actual mitigation?","test_procedure":"Inspect completed DPIAs against the statutory definition; test whether identified risks resulted in mitigation and whether the periodic cycle is met.","evidence_expected":["DPIAs covering each element of the statutory definition","Defined periodicity and triggers for reassessment on material change","Evidence of risks mitigated as a result, tracked to closure"],"scoring":{"0":"No DPIAs have been conducted.","2":"DPIAs are conducted for new projects but omit statutory elements — commonly the assessment and management of risk to rights — or are not repeated periodically.","4":"DPIAs address every statutory element, run on a defined periodic cycle and on material change, and demonstrably drive mitigation tracked to closure."},"severity":"critical","weight":1.3,"rule_slot":"SDF_DPIA_AUDIT","penalty_entry":4,"applicability":{"requires":["is_sdf"]},"note":null,"citation_caution":null},{"id":"SDF-04","domain":"SDF","title":"Periodic audit of compliance","obligation":"A Significant Data Fiduciary must undertake periodic audit, in addition to appointing an independent data auditor, as part of the additional measures required of it.","act_ref":"s.10(2)(c), DPDP Act, 2023","audit_question":"Is a periodic audit of compliance performed on the prescribed cycle, with results reported to the board and findings remediated?","test_procedure":"Inspect audit plan, completed audits and reporting; test remediation of prior findings.","evidence_expected":["Audit plan and completed audit reports on the prescribed cycle","Reporting to the board or equivalent governing body","Remediation tracking with evidence of closure"],"scoring":{"0":"No periodic audit is performed.","2":"Audits occur irregularly or are narrowly scoped, and prior findings remain open without escalation.","4":"Audits run on the prescribed cycle with adequate scope, are reported to the board, and findings are remediated and validated."},"severity":"high","weight":1.2,"rule_slot":"SDF_DPIA_AUDIT","penalty_entry":4,"applicability":{"requires":["is_sdf"]},"note":null,"citation_caution":null},{"id":"SDF-05","domain":"SDF","title":"Algorithmic software due diligence","obligation":"A Significant Data Fiduciary must observe such other measures as may be prescribed, including due diligence to verify that algorithmic software deployed by it for hosting, display, uploading, modification or transmission of personal data is not likely to pose a risk to the rights of Data Principals.","act_ref":"s.10(2)(c), DPDP Act, 2023","audit_question":"Is there an inventory of algorithmic systems processing personal data, with documented due diligence assessing risk to the rights of Data Principals — including bias, accuracy and the effect of automated decisions?","test_procedure":"Inspect the algorithm inventory and due diligence records; test one high-impact model for evidence of assessment and mitigation.","evidence_expected":["Inventory of algorithmic and machine-learning systems processing personal data","Due diligence records assessing risk to rights, including bias and accuracy testing","Mitigation and human review arrangements for high-impact decisions"],"scoring":{"0":"No inventory and no due diligence over algorithmic systems.","2":"An inventory exists and model performance is monitored technically, but risk to the rights of Data Principals — bias, contestability, effect of automated decisions — is not assessed.","4":"A complete inventory is subject to documented due diligence addressing risk to rights, with bias and accuracy testing, mitigation, and human review for high-impact decisions."},"severity":"high","weight":1.2,"rule_slot":"SDF_ALGORITHMIC_DUE_DILIGENCE","penalty_entry":4,"applicability":{"requires":["is_sdf"]},"note":null,"citation_caution":null},{"id":"SDF-06","domain":"SDF","title":"Transfer restrictions applicable to a Significant Data Fiduciary","obligation":"Additional measures prescribed for a Significant Data Fiduciary may include restrictions on the transfer outside India of specified categories of personal data or of traffic and flow data.","act_ref":"s.10(2)(c) read with s.16, DPDP Act, 2023","audit_question":"Has the entity determined whether any category of personal data or traffic data it holds is subject to a transfer restriction applicable to Significant Data Fiduciaries, and can it evidence compliance?","test_procedure":"Inspect the determination and supporting analysis; reconcile against the transfer map at XBD-01.","evidence_expected":["Analysis of applicable transfer restrictions and the categories affected","Reconciliation against the cross-border transfer map","Technical controls preventing restricted transfers"],"scoring":{"0":"The question has not been considered.","2":"An analysis exists but has not been reconciled against actual data flows, so compliance is assumed rather than evidenced.","4":"Affected categories are identified, reconciled against the transfer map, and technical controls prevent restricted transfers with monitoring for exceptions."},"severity":"high","weight":1.1,"rule_slot":"SDF_TRANSFER_RESTRICTION","penalty_entry":4,"applicability":{"requires":["is_sdf"]},"note":null,"citation_caution":"Whether any such restriction has in fact been prescribed must be confirmed against the notified Rules before this control is reported as a contravention."},{"id":"SEC-01","domain":"SEC","title":"Reasonable security safeguards programme defined and owned","obligation":"A Data Fiduciary must protect personal data in its possession or under its control, including in respect of any processing undertaken by it or on its behalf by a Data Processor, by taking reasonable security safeguards to prevent a personal data breach.","act_ref":"s.8(5), DPDP Act, 2023","audit_question":"Is there a defined, owned and approved set of security safeguards for personal data specifically — mapped to the measures the Rules prescribe — rather than a general IT security posture assumed to be sufficient?","test_procedure":"Inspect the safeguards standard and its mapping to prescribed measures; enquire of the owner; corroborate implementation for a sample of measures.","evidence_expected":["Approved security standard applicable to personal data, with named owner","Mapping of implemented controls to each prescribed safeguard","Evidence of periodic review and of gaps being tracked"],"scoring":{"0":"No defined safeguards for personal data. Security is assumed to be adequate because general IT controls exist.","2":"A general information security programme exists, but it has not been mapped to the safeguards the Rules prescribe, so coverage against the statutory standard is unknown.","4":"A personal-data-specific safeguards standard is approved and owned, explicitly mapped to each prescribed measure, with residual gaps tracked and periodically reviewed."},"severity":"critical","weight":1.4,"rule_slot":"SECURITY_SAFEGUARDS","penalty_entry":1,"applicability":{},"note":null,"citation_caution":null},{"id":"SEC-02","domain":"SEC","title":"Access control and least privilege over personal data","obligation":"Reasonable security safeguards include controls that restrict access to personal data to those who require it, as part of appropriate technical and organisational measures.","act_ref":"s.8(4), s.8(5), DPDP Act, 2023","audit_question":"Is access to personal data granted on least privilege, subject to periodic recertification, and promptly revoked on role change or exit — including for engineers with production database access and for vendor accounts?","test_procedure":"Inspect access lists against role requirements; test leaver revocation for a sample; re-perform a privilege review for one high-risk system.","evidence_expected":["Role-based access model with documented entitlements per role","Periodic access recertification records with evidence of revocations","Leaver and role-change revocation testing, including vendor accounts"],"scoring":{"0":"Access is broadly granted; production personal data is widely readable and there is no recertification.","2":"A role model exists but privilege creep is uncontrolled — standing production access for engineering, stale vendor accounts, recertification overdue or performed as a rubber stamp.","4":"Least privilege is enforced with just-in-time or approval-gated access to production personal data, recertification is timely and evidenced with actual revocations, and leaver revocation testing passes."},"severity":"critical","weight":1.3,"rule_slot":"SECURITY_SAFEGUARDS","penalty_entry":1,"applicability":{},"note":null,"citation_caution":null},{"id":"SEC-03","domain":"SEC","title":"Encryption, masking or obfuscation of personal data","obligation":"Reasonable security safeguards are understood to include measures such as encryption, obfuscation, masking or the use of virtual tokens to protect personal data.","act_ref":"s.8(5) read with the Rules, DPDP Act, 2023","audit_question":"Is personal data protected in transit and at rest, and is it masked or tokenised in non-production environments, logs, analytics extracts and support tooling?","test_procedure":"Inspect encryption configuration for transport and storage; test non-production environments and logs for unmasked personal data.","evidence_expected":["Transport and at-rest encryption configuration with key management","Masking or tokenisation in non-production, logs and analytics extracts","Evidence of testing for unmasked personal data outside production"],"scoring":{"0":"Personal data is unencrypted at rest, or production data is copied unmasked into test environments as standard practice.","2":"Transport and at-rest encryption are in place for principal systems, but non-production environments, logs or support tools still contain unmasked personal data.","4":"Encryption covers transit and rest with managed keys, non-production data is masked or synthetic, logs and analytics extracts are scrubbed, and testing confirms no unmasked personal data outside production."},"severity":"critical","weight":1.3,"rule_slot":"SECURITY_SAFEGUARDS","penalty_entry":1,"applicability":{},"note":null,"citation_caution":null},{"id":"SEC-04","domain":"SEC","title":"Logging, monitoring and detection","obligation":"Safeguards to prevent a personal data breach include the ability to detect unauthorised access, and the retention of logs to enable investigation.","act_ref":"s.8(5) read with the Rules, DPDP Act, 2023","audit_question":"Are access and activity logs over personal data captured, retained for the prescribed period, protected from tampering, and actively monitored with alerting — as opposed to retained but never examined?","test_procedure":"Inspect logging coverage and retention configuration; test alerting by reviewing recent detections and their handling; assess log integrity controls.","evidence_expected":["Logging coverage across systems holding personal data, including administrative access","Retention configuration meeting the prescribed period, with tamper protection","Alert definitions and evidence of alerts investigated and closed"],"scoring":{"0":"Access to personal data is not logged, or logs are retained for days and never reviewed.","2":"Logging exists with adequate retention but monitoring is passive — logs are available for post-incident investigation with no alerting on anomalous access.","4":"Comprehensive tamper-protected logging is retained for the prescribed period, anomalous access generates alerts, and there is evidence of alerts being investigated and closed."},"severity":"high","weight":1.2,"rule_slot":"SECURITY_SAFEGUARDS","penalty_entry":1,"applicability":{},"note":null,"citation_caution":null},{"id":"SEC-05","domain":"SEC","title":"Vulnerability management and patching","obligation":"Taking reasonable safeguards to prevent a breach requires identification and remediation of known vulnerabilities in systems processing personal data.","act_ref":"s.8(5), DPDP Act, 2023","audit_question":"Are systems holding personal data scanned and penetration tested on a defined cycle, with findings remediated to timescales tied to severity, and is the remediation backlog aged and reported?","test_procedure":"Inspect scan and test reports; test remediation timeliness against stated timescales; review the aged backlog for overdue critical findings.","evidence_expected":["Vulnerability scan and penetration test reports for the current cycle","Remediation timescales by severity and performance against them","Aged backlog with escalation of overdue high-severity items"],"scoring":{"0":"No scanning or testing of systems holding personal data.","2":"Scanning occurs and tests are commissioned, but remediation timescales are undefined or routinely exceeded, with critical findings ageing in the backlog.","4":"Scanning and testing run on a defined cycle, remediation meets severity-based timescales, and the aged backlog is reported to governance with overdue items escalated."},"severity":"high",
