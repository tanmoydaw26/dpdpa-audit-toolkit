anagement and data loss prevention are in place for employees. Contractors in the collections subsidiary use personally-owned devices with no endpoint control, and physical access to the collections floor is not restricted from the general office area.","evidence":["Background verification and confidentiality undertakings for personnel with access","Endpoint management and encryption coverage reports"],"evidence_ref":"WP-097","owner":"Arjun Nair, Chief Information Security Officer","target_date":"","auditor_note":""},"SEC-09":{"control_id":"SEC-09","score":3,"finding":"Annual penetration testing by an external firm covers the application and infrastructure, and the most recent report is dated March 2026 with findings tracked to closure. Testing has never been directed at the privacy controls themselves — consent enforcement, erasure completeness or access segregation in the warehouse.","evidence":["Independent assessment or audit reports covering personal data safeguards","Management responses with owners and dates"],"evidence_ref":"WP-098","owner":"Arjun Nair, Chief Information Security Officer","target_date":"","auditor_note":""},"XBD-01":{"control_id":"XBD-01","score":3,"finding":"Transfers are mapped for the principal SaaS platforms and the register records destination country and hosting region. The mapping omits support access from the Singapore affiliate, sub-processor locations, and the CleverTap and Meta onward flows, so it understates the actual footprint.","evidence":["Transfer map recording destination country, recipient, data categories and purpose","Treatment of remote access from outside India as a transfer"],"evidence_ref":"WP-130","owner":"Devika Iyer, VP Engineering","target_date":"","auditor_note":""},"XBD-02":{"control_id":"XBD-02","score":2,"finding":"No mechanism exists for monitoring restricted-country notifications. The entity became aware of the transfer restriction regime through this assessment and has no owner for tracking it, which means a notification would not be detected and acted upon.","evidence":["Named owner and defined monitoring mechanism for notifications","Contingency assessment for each principal destination"],"evidence_ref":"WP-131","owner":"Meera Raghunathan, Head of Legal & Compliance","target_date":"","auditor_note":""},"XBD-03":{"control_id":"XBD-03","score":2,"finding":"RBI payment system data localisation requirements are met for the payments platform, with the annual system audit report on file. Localisation requirements have not been assessed for the lending and analytics estates, and the Snowflake account holds transaction-derived data in a configuration that has not been reviewed against the RBI direction. Sectoral requirements of this kind are expressly preserved and are not displaced by compliance with the Act.","evidence":["Analysis of sectoral localisation and transfer requirements applicable to the entity","Compliance evidence for each, including any regulator filings or audit reports"],"evidence_ref":"WP-132","owner":"Meera Raghunathan, Head of Legal & Compliance","target_date":"","auditor_note":""},"XBD-04":{"control_id":"XBD-04","score":2,"finding":"Standard contractual protections are present in the major SaaS agreements. Transfers are not disclosed in the notice, no assessment of the destination environment has been performed, and the Singapore affiliate's support access operates under an intra-group arrangement that has never been documented.","evidence":["Contracts with offshore recipients containing equivalent safeguard obligations","Notice or disclosure referring to processing outside India where applicable"],"evidence_ref":"WP-133","owner":"Meera Raghunathan, Head of Legal & Compliance","target_date":"","auditor_note":""}},"assessment_date":"2026-08-14","auditor_name":"Nandita Krishnan, CIPP/E, CISA","auditor_firm":"Sentinel Assurance LLP, Chartered Accountants","engagement_ref":"SA/DPDP/2026/0417","report_title":"DPDP Act, 2023 Compliance Audit Report","scope_statement":"An assessment of the design and operating effectiveness of the entity's arrangements for compliance with the Digital Personal Data Protection Act, 2023 across the digital personal data processing activities of Kavach Financial Technologies Private Limited and its collections subsidiary, covering the systems and activities listed in the scope schedule. Fieldwork was performed between 27 July and 14 August 2026 and comprised document inspection, 19 process walkthroughs with control owners, inspection of system configuration, and substantive testing of consent, withdrawal, rights and erasure journeys on live and non-production environments.","limitations":["This assessment is based on information, documentation and explanations made available by management and on the tests described for each control. It is not an assurance engagement and expresses no audit opinion.","Testing was performed on a sample basis. The absence of a finding is not a representation that no exception exists outside the items tested.","The assessment reflects the position as at the assessment date and does not address subsequent changes in the entity's processing or in the legal framework.","Nothing in this report constitutes legal advice. Conclusions on the application of the Act to particular processing should be confirmed with qualified counsel.","Testing of erasure completeness was performed on non-production environments refreshed from production. Where a finding turns on data present in production only, this is stated in the finding.","The account aggregator's own systems and controls were not examined. Reliance was placed on its licence status and on artefacts it made available to the entity."],"scoping_assumptions":["The commencement position of individual provisions of the DPDP Act, 2023 and the DPDP Rules has not been confirmed. Findings are expressed as compliance gaps against the framework as a whole and should not be characterised as contraventions of provisions that are not yet in force.","DPDP Rules citations recorded as '[Rules citation to be verified]' were not verifiable at the time of the assessment. See the Unverified Citations appendix."],"library_version":"1.0.0","_schema":"dpdpa-audit-assessment/1"};

const SEV_RANK = DATA.severity_rank;
const NA = "NA";

/* Python's round() breaks halves to even. The difference from JavaScript's
   round shows up about once in a hundred domain figures, which is enough to
   make the app and the report disagree in the first decimal place. */
function round1(x){
  if (x === null || x === undefined) return null;
  const s = x * 10, f = Math.floor(s);
  if (Math.abs(s - f - 0.5) < 1e-9) return ((f % 2 === 0) ? f : f + 1) / 10;
  return Math.round(s) / 10;
}
function roundN(x, n){
  const p = Math.pow(10, n);
  return Math.round(x * p) / p;
}

function numericScore(v){
  if (v === null || v === undefined || v === "") return null;
  if (typeof v === "string"){
    if (v.trim().toUpperCase() === NA) return null;
    const n = parseInt(v, 10);
    return Number.isNaN(n) ? null : n;
  }
  return Math.trunc(v);
}
function isNA(v){ return typeof v === "string" && v.trim().toUpperCase() === NA; }

function flagValue(flags, name){
  if (flags && Object.prototype.hasOwnProperty.call(flags, name)) return !!flags[name];
  const d = DATA.profile_flags.find(f => f.name === name);
  return d ? !!d.default : false;
}
function appliesTo(ctrl, flags){
  const a = ctrl.applicability || {};
  for (const f of a.requires || []) if (!flagValue(flags, f)) return false;
  for (const f of a.excluded_if || []) if (flagValue(flags, f)) return false;
  return true;
}
function scopeReason(ctrl, flags){
  const a = ctrl.applicability || {};
  const unmet = (a.requires || []).filter(f => !flagValue(flags, f));
  const hit = (a.excluded_if || []).filter(f => flagValue(flags, f));
  const parts = [];
  if (unmet.length) parts.push("requires " + unmet.join(", "));
  if (hit.length) parts.push("excluded by " + hit.join(", "));
  return parts.length ? parts.join("; ") : "in scope";
}

function ruleSlot(key){ return key ? (DATA.citations.rule_slots[key] || null) : null; }
function ruleCitationText(ctrl){
  const s = ruleSlot(ctrl.rule_slot);
  if (!s) return "—";
  if (s.citation) return String(s.citation);
  return "[Rules citation to be verified]";
}
function ruleStatus(ctrl){ const s = ruleSlot(ctrl.rule_slot); return s ? s.status : null; }
function penaltyFor(ctrl){
  if (ctrl.penalty_entry === null || ctrl.penalty_entry === undefined) return null;
  return DATA.citations.penalty_schedule.entries.find(e => e.entry === ctrl.penalty_entry) || null;
}

function maturityBand(pct){
  if (pct === null || pct === undefined) return ["Not assessed", "No applicable controls were assessed."];
  for (const b of DATA.maturity_bands) if (pct >= b[0] && pct < b[1]) return [b[2], b[3]];
  const l = DATA.maturity_bands[DATA.maturity_bands.length - 1];
  return ["Optimised", l[3]];
}
function riskBandOf(risk){
  if (risk === null || risk === undefined) return "Not assessed";
  for (const b of DATA.risk_bands) if (risk >= b[0] && risk < b[1]) return b[2];
  return "Critical";
}
function priorityFor(risk){
  for (const r of DATA.priority_rules) if (risk >= r[1]) return {code:r[0], days:r[2], desc:r[3]};
  const l = DATA.priority_rules[DATA.priority_rules.length - 1];
  return {code:l[0], days:l[2], desc:l[3]};
}
function statusLabel(r){
  if (!r.in_scope) return "Out of scope";
  if (r.not_applicable) return "Not applicable";
  if (r.score === null) return "Not assessed";
  if (r.score >= 4) return "Compliant";
  if (r.score >= DATA.substantially_compliant) return "Substantially compliant";
  if (r.score >= 2) return "Partially compliant";
  return "Non-compliant";
}

function scoreAssessment(a){
  const flags = a.profile.flags || {};
  const domains = DATA.domains.map(dom => {
    const results = DATA.controls.filter(c => c.domain === dom.code).map(ctrl => {
      const in_scope = appliesTo(ctrl, flags);
      const resp = a.responses[ctrl.id];
      let score = (resp && in_scope) ? numericScore(resp.score) : null;
      if (score !== null) score = Math.max(0, Math.min(4, score));
      const r = {
        control: ctrl, in_scope: in_scope, scope_reason: scopeReason(ctrl, flags),
        score: score,
        not_applicable: !!(resp && isNA(resp.score)),
        finding: resp ? (resp.finding || "") : "",
        evidence: resp ? (resp.evidence || []).slice() : [],
        evidence_ref: resp ? (resp.evidence_ref || "") : "",
        owner: resp ? (resp.owner || "") : "",
        target_date: resp ? (resp.target_date || "") : "",
        auditor_note: resp ? (resp.auditor_note || "") : "",
        act_ref: ctrl.act_ref,
        rule_citation: ruleCitationText(ctrl),
        rule_status: ruleStatus(ctrl),
        penalty: penaltyFor(ctrl),
      };
      r.assessed = r.score !== null;
      r.risk = r.score === null ? null : SEV_RANK[ctrl.severity] * (4 - r.score);
      r.risk_band = riskBandOf(r.risk);
      r.maturity_pct = r.score === null ? null : round1(r.score / 4 * 100);
      r.is_gap = r.score !== null && r.score < DATA.substantially_compliant;
      r.status_label = statusLabel(r);
      return r;
    });
    const d = Object.assign({}, dom, {results: results});
    d.scored = results.filter(r => r.assessed);
    d.in_scope_results = results.filter(r => r.in_scope && !r.not_applicable);
    d.gaps = results.filter(r => r.is_gap);
    d.unassessed = results.filter(r => r.in_scope && !r.not_applicable && !r.assessed);
    if (d.scored.length){
      const num = d.scored.reduce((t, r) => t + r.score * r.control.weight, 0);
      const den = d.scored.reduce((t, r) => t + 4 * r.control.weight, 0);
      d.maturity_pct = den ? round1(num / den * 100) : null;
    } else {
      d.maturity_pct = null;
    }
    d.band = maturityBand(d.maturity_pct)[0];
    d.max_risk = d.scored.length ? Math.max(...d.scored.map(r => r.risk || 0)) : 0;
    d.critical_gap_count = d.gaps.filter(r => r.control.severity === "critical").length;
    return d;
  });

  const res = {domains: domains};
  res.all = domains.flatMap(d => d.results);
  res.byId = {};
  for (const r of res.all) res.byId[r.control.id] = r;

  const contributing = domains.filter(d => d.maturity_pct !== null);
  if (contributing.length){
    const num = contributing.reduce((t, d) => t + d.maturity_pct * d.weight, 0);
    const den = contributing.reduce((t, d) => t + d.weight, 0);
    res.overall_maturity_pct = den ? round1(num / den) : null;
  } else {
    res.overall_maturity_pct = null;
  }
  res.overall_band = maturityBand(res.overall_maturity_pct);
  res.in_scope_count = domains.reduce((t, d) => t + d.in_scope_results.length, 0);
  res.out_of_scope_count = res.all.filter(r => !r.in_scope).length;
  res.na_count = res.all.filter(r => r.not_applicable).length;
  res.scored = res.all.filter(r => r.assessed);
  res.assessed_count = res.scored.length;
  res.unassessed = domains.flatMap(d => d.unassessed);
  res.coverage_pct = res.in_scope_count ? round1(res.assessed_count / res.in_scope_count * 100) : 0.0;
  res.gaps = res.all.filter(r => r.is_gap);

  res.gap_counts_by_severity = {critical:0, high:0, medium:0, low:0};
  for (const r of res.gaps) res.gap_counts_by_severity[r.control.severity] += 1;
  res.status_counts = {};
  for (const r of res.all) res.status_counts[r.status_label] = (res.status_counts[r.status_label] || 0) + 1;

  res.penalty_exposure = penaltyExposure(res);
  return res;
}

function penaltyExposure(res){
  const engaged = new Map();
  for (const r of res.gaps){
    if (!r.penalty) continue;
    const e = r.penalty.entry;
    if (!engaged.has(e)) engaged.set(e, {
      entry:e, breach:r.penalty.breach, provision:r.penalty.provision,
      label:r.penalty.label, max_inr_crore:r.penalty.max_penalty_inr_crore,
      controls:[],
    });
    engaged.get(e).controls.push(r.control.id);
  }
  const entries = [...engaged.values()].sort((a, b) => (b.max_inr_crore || 0) - (a.max_inr_crore || 0));
  const total = entries.reduce((t, e) => t + (e.max_inr_crore || 0), 0);
  return {
    entries: entries,
    aggregate_max_inr_crore: roundN(total, 3),
    basis: DATA.penalty_basis,
    caveat: DATA.penalty_caveat,
  };
}

function addDays(iso, days){
  const d = new Date(iso + "T00:00:00Z");
  d.setUTCDate(d.getUTCDate() + days);
  return d.toISOString().slice(0, 10);
}
function buildGapRegister(res, assessmentDate){
  const ordered = res.gaps.slice().sort((a, b) =>
    (b.risk || 0) - (a.risk || 0) ||
    SEV_RANK[b.control.severity] - SEV_RANK[a.control.severity] ||
    (a.control.id < b.control.id ? -1 : a.control.id > b.control.id ? 1 : 0));
  return ordered.map((r, i) => {
    const risk = r.risk || 0;
    const p = priorityFor(risk);
    const dom = res.domains.find(d => d.code === r.control.domain);
    return {
      ref: "G" + String(i + 1).padStart(3, "0"),
      control_id: r.control.id,
      domain_code: r.control.domain,
      domain_name: dom ? dom.name : r.control.domain,
      title: r.control.title,
      severity: cap(r.control.severity),
      score: r.score === null ? 0 : r.score,
      risk: risk,
      risk_band: r.risk_band,
      priority: p.code,
      due_date: r.target_date || addDays(assessmentDate, p.days),
      act_ref: r.act_ref,
      rule_citation: r.rule_citation,
      penalty_label: r.penalty ? r.penalty.label : "—",
      finding: r.finding || "(no finding recorded)",
      target_state: r.control.scoring["4"] || "",
      owner: r.owner || "(unassigned)",
      evidence_ref: r.evidence_ref || "—",
    };
  });
}
function cap(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

function blankProfile(){
  const flags = {};
  for (const f of DATA.profile_flags) flags[f.name] = !!f.default;
  return {
    legal_name:"", trading_name:"", sector:"", registered_office:"",
    headcount:null, data_principal_count:null, business_description:"",
    systems_in_scope:[], entities_in_scope:[], exclusions:[], flags:flags,
  };
}
function blankAssessment(){
  const a = {
    profile: blankProfile(), responses: {},
    assessment_date: new Date().toISOString().slice(0, 10),
    auditor_name:"", auditor_firm:"", engagement_ref:"",
    report_title:"DPDPA Compliance Audit Report",
    scope_statement:"",
    limitations: DATA.default_limitations.slice(),
    scoping_assumptions: DATA.default_scoping_assumptions.slice(),
    library_version: DATA.library_version,
  };
  for (const c of DATA.controls) if (appliesTo(c, a.profile.flags)) response(a, c.id);
  return a;
}
function response(a, cid){
  if (!a.responses[cid]) a.responses[cid] = {
    control_id:cid, score:null, finding:"", evidence:[], evidence_ref:"",
    owner:"", target_date:"", auditor_note:"",
  };
  return a.responses[cid];
}
function normalise(raw){
  const a = blankAssessment();
  a.responses = {};
  for (const k of Object.keys(a)) if (k in raw && k !== "profile" && k !== "responses") a[k] = raw[k];
  const p = blankProfile();
  for (const k of Object.keys(p)) if (k in (raw.profile || {})) p[k] = raw.profile[k];
  p.flags = Object.assign({}, p.flags, (raw.profile || {}).flags || {});
  a.profile = p;
  for (const [cid, r] of Object.entries(raw.responses || {})){
    if (!DATA.byId[cid]) continue;   // a control that is no longer in the library
    const t = response(a, cid);
    for (const f of RESP_FIELDS) if (f in r) t[f] = r[f];
    t.control_id = cid;
  }
  return a;
}
function exportPayload(){
  const out = {
    profile: state.profile,
    responses: {},
    assessment_date: state.assessment_date,
    auditor_name: state.auditor_name,
    auditor_firm: state.auditor_firm,
    engagement_ref: state.engagement_ref,
    report_title: state.report_title,
    scope_statement: state.scope_statement,
    limitations: state.limitations,
    scoping_assumptions: state.scoping_assumptions,
    library_version: state.library_version,
    _schema: "dpdpa-audit-assessment/1",
  };
  for (const [cid, r] of Object.entries(state.responses)){
    const o = {};
    for (const f of RESP_FIELDS) o[f] = r[f];
    out.responses[cid] = o;
  }
  return out;
}

function recompute(){ results = scoreAssessment(state); }

const STATUS_FILTERS = [
  ["all",        "All",             r => true],
  ["open",       "Not assessed",    r => r.in_scope && !r.not_applicable && !r.assessed],
  ["gap",        "Gaps",            r => r.is_gap],
  ["critical",   "Critical gaps",   r => r.is_gap && r.control.severity === "critical"],
  ["done",       "At or above 3",   r => r.assessed && r.score >= DATA.substantially_compliant],
  ["na",         "Not applicable",  r => r.not_applicable],
  ["out",        "Out of scope",    r => !r.in_scope],
];

function visibleResults(){
  const f = STATUS_FILTERS.find(x => x[0] === statusFilter)[2];
  const q = searchTerm.trim().toLowerCase();
  return results.all.filter(r => {
    if (domainFilter !== "ALL" && r.control.domain !== domainFilter) return false;
    if (cellFilter && !cellFilter.ids.has(r.control.id)) return false;
    if (!f(r)) return false;
    if (q){
      const hay = (r.control.id + " " + r.control.title + " " + r.control.obligation + " " +
                   r.control.act_ref + " " + r.finding).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function wireCard(node, cid){
  node.querySelectorAll(".stop").forEach(btn => {
    btn.onclick = () => {
      const s = parseInt(btn.dataset.score, 10);
      const cur = response(state, cid);
      cur.score = (cur.score === s) ? null : s;
      afterScore(node, cid);
    };
  });
  const naBtn = node.querySelector("[data-na]");
  if (naBtn) naBtn.onclick = () => {
    const cur = response(state, cid);
    cur.score = isNA(cur.score) ? null : NA;
    afterScore(node, cid);
  };
  node.querySelectorAll("[data-f]").forEach(inp => {
    inp.oninput = () => {
      const cur = response(state, cid);
      const f = inp.dataset.f;
      cur[f] = (f === "evidence") ? inp.value.split("\n").map(s => s.trim()).filter(Boolean) : inp.value;
      touch();
      refreshStrip(cid);
      renderSpine();
      renderTallies();
    };
  });
  const stops = [...node.querySelectorAll(".stop")];
  stops.forEach((btn, i) => {
    btn.onkeydown = ev => {
      const d = ev.key === "ArrowRight" ? 1 : ev.key === "ArrowLeft" ? -1 : 0;
      if (!d) return;
      ev.preventDefault();
      stops[(i + d + stops.length) % stops.length].focus();
    };
  });
}
function afterScore(node, cid){
  touch();
  const r = results.byId[cid];
  node.querySelectorAll(".stop").forEach(b => {
    b.setAttribute("aria-checked", String(!r.not_applicable && r.score === parseInt(b.dataset.score, 10)));
  });
  const naBtn = node.querySelector("[data-na]");
  if (naBtn) naBtn.setAttribute("aria-pressed", String(r.not_applicable));
  node.className = "card card--" + (!r.in_scope ? "out" : r.is_gap ? "gap" :
      (r.assessed && r.score >= DATA.substantially_compliant) ? "ok" : "open");
  const ownerField = node.querySelector('[data-f="owner"]');
  if (ownerField) ownerField.parentElement.classList.toggle("f--want", r.is_gap && !r.owner);
  refreshStrip(cid);
  renderSpine();
  renderTallies();
}
function refreshStrip(cid){
  const s = $("strip-" + cid);
  if (s) s.innerHTML = stripHTML(results.byId[cid]);
}

function renderFieldwork(){
  const dom = domainFilter === "ALL" ? null : results.domains.find(d => d.code === domainFilter);
  let h = '<section class="sec"><div class="sec__head"><span class="lbl">Fieldwork</span>' +
    '<h2>' + (dom ? esc(dom.code + " — " + dom.name) : "All 17 domains") + '</h2></div>';

  if (dom){
    h += '<div class="domhead"><span class="lbl">Domain weight ' + dom.weight +
      ' · ' + dom.in_scope_results.length + ' of ' + dom.results.length + ' controls in scope · ' +
      pct(dom.maturity_pct) + ' · ' + esc(dom.band) + '</span>' +
      '<h3>' + esc(dom.name) + '</h3>' +
      '<p><strong>Scope question.</strong> ' + esc(dom.scope_question) + '</p>' +
      '<p><strong>Why it matters.</strong> ' + esc(dom.why_it_matters) + '</p></div>';
  }

  h += '<div class="tools"><input class="search" id="q" type="search" placeholder="Search control, obligation, section, finding" value="' + esc(searchTerm) + '">';
  for (const [key, label] of STATUS_FILTERS){
    const n = results.all.filter(r =>
      (domainFilter === "ALL" || r.control.domain === domainFilter) &&
      STATUS_FILTERS.find(x => x[0] === key)[2](r)).length;
    h += '<button class="chip" data-status="' + key + '" aria-pressed="' + (statusFilter === key) + '">' +
         label + '<span class="tally">' + n + '</span></button>';
  }
  h += "</div>";

  if (cellFilter){
    h += '<div class="panel panel--sink" style="display:flex;gap:14px;align-items:center;justify-content:space-between">' +
      '<span class="hint">Showing ' + cellFilter.ids.size + ' controls from the risk grid: ' + esc(cellFilter.label) + '</span>' +
      '<button class="chip" id="clearCell">Clear grid filter</button></div>';
  }

  const vis = visibleResults();
  if (!vis.length){
    h += '<div class="empty"><p>No controls match this filter.</p>' +
         '<p>Pick another domain in the left column, or set the status filter back to All.</p></div>';
  } else {
    h += vis.map(cardHTML).join("");
  }
  h += "</section>";
  $("main").innerHTML = h;

  const q = $("q");
  q.oninput = () => {
    searchTerm = q.value;
    const at = q.selectionStart;
    renderFieldwork();
    const nq = $("q");
    nq.focus();
    nq.setSelectionRange(at, at);
  };
  $("main").querySelectorAll("[data-status]").forEach(b => {
    b.onclick = () => { statusFilter = b.dataset.status; renderFieldwork(); };
  });
  if ($("clearCell")) $("clearCell").onclick = () => { cellFilter = null; renderFieldwork(); };
  for (const r of vis){
    const node = $("card-" + r.control.id);
    if (node) wireCard(node, r.control.id);
  }
}

/* ---- findings ----------------------------------------------------------- */
function riskGridHTML(){
  const cellIds = {};
  for (const r of results.scored){
    const k = SEV_RANK[r.control.severity] + ":" + r.score;
    (cellIds[k] = cellIds[k] || []).push(r.control.id);
  }
  window.__cellIds = cellIds;

  let h = '<table class="grid"><thead><tr><th></th>' +
    [4,3,2,1,0].map(s => '<th>score ' + s + '</th>').join("") + '</tr></thead><tbody>';
  for (const sev of ["critical","high","medium","low"]){
    const rank = SEV_RANK[sev];
    h += '<tr><th class="rowh">' + sev + ' (×' + rank + ')</th>';
    for (const s of [4,3,2,1,0]){
      const risk = rank * (4 - s);
      const ids = cellIds[rank + ":" + s] || [];
      const tint = risk === 0 ? 0 : Math.min(4, Math.ceil(risk / 4));
      h += '<td><div class="cell cell--' + tint + (ids.length ? "" : " cell--empty") + '" ' +
        'data-cell="' + rank + ":" + s + '" ' +
        'title="' + sev + ' severity scored ' + s + ' of 4 — residual risk ' + risk +
        ' of 16 (' + riskBandOf(risk) + '). ' + ids.length + ' controls."' +
        (ids.length ? ' tabindex="0"' : "") + '>' +
        '<span class="cell__n">' + (ids.length || "·") + '</span>' +
        '<span class="cell__r">risk ' + risk + '</span></div></td>';
    }
    h += "</tr>";
  }
  h += "</tbody></table>";
  return h;
}

function renderFindings(){
  const r = results;
  const gaps = buildGapRegister(r, state.assessment_date);
  const pe = r.penalty_exposure;
  const sev = r.gap_counts_by_severity;

  let h = '<section class="sec"><div class="sec__head"><span class="lbl">Findings</span>' +
    '<h2>Residual risk and the gap register</h2></div>';

  h += '<div class="figs">' +
    fig(pct(r.overall_maturity_pct), r.overall_band[0], "indigo") +
    fig(r.gaps.length, "gaps below 3 of 4", "mark") +
    fig(sev.critical, "critical-severity gaps", "mark") +
    fig(pct(r.coverage_pct), r.assessed_count + " of " + r.in_scope_count + " assessed", "") +
    fig("INR " + pe.aggregate_max_inr_crore + " cr", "exposure ceiling", "mark") +
    "</div>";

  h += '<p class="sec__lede">' + esc(r.overall_band[1]) + '</p>';

  h += '<div class="panel"><span class="lbl">Residual risk · severity × shortfall</span>' +
    '<p class="caveat" style="margin:6px 0 12px">Residual risk is severity rank multiplied by the shortfall from 4, ' +
    'so the grid is the arithmetic rather than a judgement laid over it. Select a cell to work that population in Fieldwork.</p>' +
    riskGridHTML() +
    '<p class="gridkey">Bands: 12 and above Critical · 8–11 High · 4–7 Medium · 1–3 Low · 0 None. ' +
    'Unassessed controls carry no risk figure and are reported as a scope limitation.</p></div>';

  const sc = Object.entries(r.status_counts).sort((a, b) => b[1] - a[1]);
  h += '<div class="panel panel--sink"><span class="lbl">Where the 90 controls stand</span><p class="caveat" style="margin-top:6px">' +
    sc.map(([k, v]) => '<span class="num" style="font-weight:600">' + v + '</span> ' + esc(k)).join(" &nbsp;·&nbsp; ") +
    '</p></div>';

  if (pe.entries.length){
    h += '<div class="panel"><span class="lbl">Penalty exposure under the Schedule</span>' +
      '<div class="tw" style="margin-top:10px;border:0"><table class="t"><thead><tr>' +
      '<th>Entry</th><th>Provision</th><th>Breach</th><th>Maximum</th><th>Controls engaging it</th>' +
      '</tr></thead><tbody>';
    for (const e of pe.entries){
      h += '<tr><td class="c n">' + e.entry + '</td><td class="n">' + esc(e.provision) + '</td>' +
        '<td>' + esc(e.breach) + '</td><td class="n">' + esc(e.label) + '</td>' +
        '<td class="cids">' + esc(e.controls.join(", ")) + '</td></tr>';
    }
    h += '<tr style="background:var(--bond-sink)"><td colspan="3" style="text-align:right"><strong>Aggregate ceiling</strong></td>' +
      '<td class="n" style="color:var(--mark);font-weight:600">INR ' + pe.aggregate_max_inr_crore + ' crore</td><td></td></tr>';
    h += '</tbody></table></div><p class="caveat">' + esc(pe.caveat) + '</p></div>';
  }

  h += '<div class="sec__head" style="margin-top:26px"><span class="lbl">Gap register · ' + gaps.length + ' entries</span>' +
    '<h2>Ordered by residual risk</h2></div>';
  if (!gaps.length){
    h += '<div class="empty"><p>No gaps recorded.</p><p>Score controls in Fieldwork; anything below 3 of 4 appears here with a priority and a target date.</p></div>';
  } else {
    h += '<div class="tw"><table class="t"><thead><tr>' +
      ['Ref','Control','Domain','Severity','Score','Risk','Band','Priority','Target date','Owner','Evidence','Finding']
        .map(x => "<th>" + x + "</th>").join("") + '</tr></thead><tbody>';
    for (const g of gaps){
      h += '<tr><td class="n">' + g.ref + '</td><td class="id">' + g.control_id + '</td>' +
        '<td>' + esc(g.domain_name) + '</td>' +
        '<td><span class="sev sev--' + g.severity.toLowerCase() + '">' + g.severity + '</span></td>' +
        '<td class="c n">' + g.score + '</td><td class="c n">' + g.risk + '</td>' +
        '<td class="n">' + g.risk_band + '</td>' +
        '<td class="c"><span class="pri pri--' + g.priority + '">' + g.priority + '</span></td>' +
        '<td class="n">' + esc(g.due_date) + '</td>' +
        '<td>' + esc(g.owner) + '</td><td class="n">' + esc(g.evidence_ref) + '</td>' +
        '<td style="min-width:26ch">' + esc(g.finding) + '</td></tr>';
    }
    h += "</tbody></table></div>";
  }

  if (r.unassessed.length){
    h += '<div class="panel panel--sink" style="margin-top:18px"><span class="lbl">Scope limitation · ' +
      r.unassessed.length + ' in-scope controls unassessed</span>' +
      '<p class="caveat">These are reported as a limitation on the work performed, not as findings. ' +
      'An unassessed control carries no score and no risk figure.</p>' +
      '<p class="cids">' + esc(r.unassessed.map(x => x.control.id).join(", ")) + '</p></div>';
  }

  h += "</section>";
  $("main").innerHTML = h;

  $("main").querySelectorAll("[data-cell]").forEach(c => {
    const ids = window.__cellIds[c.dataset.cell] || [];
    if (!ids.length) return;
    const go = () => {
      const [rank, s] = c.dataset.cell.split(":");
      const sevName = Object.keys(SEV_RANK).find(k => String(SEV_RANK[k]) === rank);
      cellFilter = {ids:new Set(ids), label:sevName + " severity scored " + s + " of 4"};
      domainFilter = "ALL"; statusFilter = "all"; searchTerm = "";
      setView("field");
    };
    c.onclick = go;
    c.onkeydown = ev => { if (ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); go(); } };
  });
}
function fig(v, s, tone){
  return '<div class="fig"><div class="fig__v' + (tone ? " fig__v--" + tone : "") + '">' + esc(v) + '</div>' +
         '<div class="fig__s">' + esc(s) + '</div></div>';
}

/* ---- citations ---------------------------------------------------------- */
function renderCitations(){
  const slots = Object.entries(DATA.citations.rule_slots);
  const usedBy = {};
  for (const c of DATA.controls) if (c.rule_slot) (usedBy[c.rule_slot] = usedBy[c.rule_slot] || []).push(c.id);
  const unver = slots.filter(([, s]) => s.status === "VERIFY_AGAINST_NOTIFIED_RULES");

  let h = '<section class="sec"><div class="sec__head"><span class="lbl">Citations</span>' +
    '<h2>What is cited, and what is not yet</h2></div>' +
    '<p class="sec__lede">Every control is anchored to a section of the DPDP Act, 2023, which is cited in full. ' +
    'Citations to the DPDP Rules are held as named slots. Where a slot has not been checked against the notified text ' +
    'it renders as a ruled blank rather than a plausible-looking rule number — in this app, in the workbook and in the report. ' +
    'Fill the slot once in <span class="num">controls/citations.yaml</span>, rebuild, and every deliverable carries the citation.</p>';

  h += '<div class="figs">' +
    fig(slots.length - unver.length, "slots verified", "") +
    fig(unver.length, "slots awaiting verification", "mark") +
    fig(DATA.controls.filter(c => c.rule_slot && unver.some(([k]) => k === c.rule_slot)).length, "controls relying on them", "") +
    fig(DATA.citations.penalty_schedule.entries.length, "Schedule entries, all verified", "") +
    "</div>";

  h += '<div class="panel"><span class="lbl">Rules slots</span><div class="tw" style="margin-top:10px;border:0">' +
    '<table class="t"><thead><tr><th>Slot</th><th>Subject</th><th>Act anchor</th><th>Rules citation</th><th>Status</th><th>Controls</th></tr></thead><tbody>';
  for (const [key, s] of slots){
    const ok = s.status !== "VERIFY_AGAINST_NOTIFIED_RULES";
    h += '<tr><td class="n" style="font-size:11px">' + key.replace(/_/g, "_​") + '</td>' +
      '<td>' + esc(s.subject || "") + '</td>' +
      '<td class="n" style="font-size:11px">' + esc(s.anchors_act || "—") + '</td>' +
      '<td>' + (s.citation ? '<span class="num">' + esc(s.citation) + '</span>'
                           : '<span class="slot">&nbsp;</span>') + '</td>' +
      '<td><span class="stat ' + (ok ? "stat--ok" : "stat--no") + '">' + esc(s.status) + '</span></td>' +
      '<td class="cids">' + esc((usedBy[key] || []).join(", ") || "reserved — not referenced") + '</td></tr>';
  }
  h += "</tbody></table></div></div>";

  h += '<div class="panel"><span class="lbl">Penalty Schedule to the DPDP Act, 2023 · verified against the Act</span>' +
    '<div class="tw" style="margin-top:10px;border:0"><table class="t"><thead><tr>' +
    '<th>Entry</th><th>Provision</th><th>Breach</th><th>Maximum penalty</th></tr></thead><tbody>';
  for (const e of DATA.citations.penalty_schedule.entries){
    h += '<tr><td class="c n">' + e.entry + '</td><td class="n">' + esc(e.provision) + '</td>' +
      '<td>' + esc(e.breach) + '</td><td class="n">' + esc(e.label) + '</td></tr>';
  }
  h += '</tbody></table></div><p class="caveat">' + esc(DATA.citations.penalty_schedule.determination_factors_note || "") + '</p></div>';

  const srcs = (DATA.citations.meta || {}).primary_sources_to_check || [];
  if (srcs.length){
    h += '<div class="panel panel--sink"><span class="lbl">Verify against</span><ul class="evlist" style="margin-top:6px">' +
      srcs.map(s => '<li>' + esc(s) + '</li>').join("") + '</ul></div>';
  }
  h += "</section>";
  $("main").innerHTML = h;
}

/* ---- scope -------------------------------------------------------------- */
function renderScope(){
  const p = state.profile;
  const F = (label, key, obj, type, wide) =>
    '<label class="f' + (wide ? " f--wide" : "") + '"><span class="lbl">' + label + '</span>' +
    (type === "textarea"
      ? '<textarea data-s="' + obj + "." + key + '" rows="3">' + esc(objGet(obj, key)) + '</textarea>'
      : '<input data-s="' + obj + "." + key + '" type="' + (type || "text") + '" value="' + esc(objGet(obj, key)) + '">') +
    "</label>";

  let h = '<section class="sec"><div class="sec__head"><span class="lbl">Scope</span>' +
    '<h2>Who is being audited, and which controls that puts in scope</h2></div>' +
    '<p class="sec__lede">The answers below decide the composition of the audit, so the control set is reproducible from them. ' +
    'Flags that widen scope default to on: silence widens the audit rather than quietly narrowing it, and every exemption has to be claimed.</p>';

  h += '<div class="panel"><span class="lbl">The entity</span><div class="fields" style="margin-top:10px">' +
    F("Legal name of the Data Fiduciary", "legal_name", "profile") +
    F("Trading or brand name", "trading_name", "profile") +
    F("Sector", "sector", "profile") +
    F("Registered office", "registered_office", "profile") +
    F("Headcount", "headcount", "profile", "number") +
    F("Data Principals, approximate", "data_principal_count", "profile", "number") +
    F("What the processing is, in one line", "business_description", "profile", "textarea", true) +
    "</div></div>";

  h += '<div class="panel"><span class="lbl">The engagement</span><div class="fields" style="margin-top:10px">' +
    F("Assessment date", "assessment_date", "root", "date") +
    F("Auditor", "auditor_name", "root") +
    F("Firm", "auditor_firm", "root") +
    F("Engagement reference", "engagement_ref", "root") +
    F("Report title", "report_title", "root", "text", true) +
    F("Scope statement", "scope_statement", "root", "textarea", true) +
    "</div></div>";

  h += '<div class="panel"><span class="lbl">Boundary · one per line</span><div class="fields" style="margin-top:10px">' +
    LF("Entities within scope", "entities_in_scope") +
    LF("Systems and environments examined", "systems_in_scope") +
    LF("Exclusions from scope", "exclusions") +
    "</div></div>";

  const inScope = DATA.controls.filter(c => appliesTo(c, p.flags));
  const out = DATA.controls.filter(c => !appliesTo(c, p.flags));
  h += '<div class="panel"><span class="lbl">Applicability</span>' +
    '<p class="caveat" style="margin:6px 0 14px"><span class="num" style="font-weight:600">' + inScope.length +
    '</span> of <span class="num">' + DATA.controls.length + '</span> controls are in scope on these answers.' +
    (out.length ? ' Out of scope: <span class="cids">' + out.map(c => esc(c.id) + " (" + esc(scopeReason(c, p.flags)) + ")").join("; ") + "</span>" : "") +
    "</p>";
  for (const f of DATA.profile_flags){
    const gated = DATA.controls.filter(c => {
      const a = c.applicability || {};
      return (a.requires || []).includes(f.name) || (a.excluded_if || []).includes(f.name);
    });
    h += '<div class="flag"><div><div class="flag__name">' + f.name + '</div>' +
      '<p class="flag__desc">' + esc(f.description) + '</p>' +
      '<div class="flag__gates">' + (gated.length
        ? "gates " + gated.length + " control" + (gated.length === 1 ? "" : "s") + ": " + gated.map(c => c.id).join(", ")
        : "gates no controls in this library") +
      ' · default ' + (f.default ? "on" : "off") + '</div></div>' +
      '<button class="tog" data-flag="' + f.name + '" aria-pressed="' + flagValue(p.flags, f.name) + '">' +
      (flagValue(p.flags, f.name) ? "Yes" : "No") + "</button></div>";
  }
  h += "</div>";

  h += '<div class="panel panel--sink"><span class="lbl">Carried into the report</span>' +
    '<p class="caveat">Scoping assumptions and limitations travel with the assessment file and print in the report. ' +
    'They are editable in the file; the two DPDP-specific assumptions below are set for you.</p>' +
    '<ul class="evlist" style="margin-top:8px">' +
    state.scoping_assumptions.map(s => '<li>' + esc(s) + '</li>').join("") + '</ul></div>';

  h += "</section>";
  $("main").innerHTML = h;

  $("main").querySelectorAll("[data-s]").forEach(inp => {
    inp.oninput = () => {
      const [obj, key] = inp.dataset.s.split(".");
      let v = inp.value;
      if (inp.type === "number") v = v === "" ? null : parseInt(v, 10);
      if (obj === "profile") state.profile[key] = v; else state[key] = v;
      touch(); renderMast(); renderSpine(); renderTallies();
    };
  });
  $("main").querySelectorAll("[data-l]").forEach(inp => {
    inp.oninput = () => {
      state.profile[inp.dataset.l] = inp.value.split("\n").map(s => s.trim()).filter(Boolean);
      touch();
    };
  });
  $("main").querySelectorAll("[data-flag]").forEach(btn => {
    btn.onclick = () => {
      const name = btn.dataset.flag;
      state.profile.flags[name] = !flagValue(state.profile.flags, name);
      for (const c of DATA.controls) if (appliesTo(c, state.profile.flags)) response(state, c.id);
      touch();
      const y = window.scrollY;
      renderScope(); renderSpine(); renderTallies();
      window.scrollTo(0, y);
    };
  });
}
function LF(label, key){
  return '<label class="f f--wide"><span class="lbl">' + label + '</span>' +
    '<textarea data-l="' + key + '" rows="3">' + esc((state.profile[key] || []).join("\n")) + '</textarea></label>';
}
function objGet(obj, key){
  const v = obj === "profile" ? state.profile[key] : state[key];
  return v === null || v === undefined ? "" : v;
}

/* ======================================================================== */
/* SHELL                                                                    */
/* ======================================================================== */
function setView(v){
  view = v;
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.view === v)));
  renderView();
  window.scrollTo(0, 0);
}
function renderView(){
  if (view === "scope") renderScope();
  else if (view === "find") renderFindings();
  else if (view === "cite") renderCitations();
  else renderFieldwork();
}

document.querySelectorAll(".tab").forEach(t => { t.onclick = () => setView(t.dataset.view); });

$("btnSave").onclick = () => {
  const p = state.profile;
  const slug = (p.trading_name || p.legal_name || "engagement")
    .replace(/[^A-Za-z0-9]+/g, "_").replace(/^_+|_+$/g, "") || "engagement";
  const blob = new Blob([JSON.stringify(exportPayload(), null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = slug + "_dpdpa_assessment.json";
  a.click();
  URL.revokeObjectURL(a.href);
  setSaveState("saved — run report on it");
};
$("btnOpen").onclick = () => $("fileIn").click();
$("fileIn").onchange = ev => {
  const f = ev.target.files[0];
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try{
      state = normalise(JSON.parse(rd.result));
      touch(); renderAll();
      setSaveState("opened " + f.name);
    }catch(e){
      setSaveState("that file did not parse");
      alert("That file is not a readable assessment file.\n\n" + e.message +
            "\n\nExpected the JSON written by this app or by python -m dpdpa_audit init.");
    }
  };
  rd.readAsText(f);
  ev.target.value = "";
};
$("btnNew").onclick = () => {
  if (!confirm("Start a new assessment? The current one is discarded unless you have saved it to a file.")) return;
  state = blankAssessment();
  domainFilter = "ALL"; statusFilter = "all"; searchTerm = ""; cellFilter = null;
  touch(); renderAll(); setView("scope");
};

/* Boot: whatever the browser kept, else the worked example that ships with
   the toolkit, so the app is never an empty room. */
(function boot(){
  let raw = null;
  try{ raw = localStorage.getItem(STORE_KEY); }catch(e){ raw = null; }
  if (raw){
    try{ state = normalise(JSON.parse(raw)); setSaveState("kept in this browser"); }
    catch(e){ state = null; }
  }
  if (!state && SAMPLE){
    state = normalise(SAMPLE);
    setSaveState("sample engagement loaded");
  }
  if (!state){ state = blankAssessment(); setSaveState("new assessment"); }
  recompute();
  renderMast();
  renderSpine();
  renderTallies();
  setView("field");
})();
</script>
