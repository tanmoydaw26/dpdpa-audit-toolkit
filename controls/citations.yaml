    anchors_act: "s.1(2)"
    citation: null
    status: VERIFY_AGAINST_NOTIFIED_RULES
    verified_by: null
    verified_on: null
    note: >-
      HIGHEST-PRIORITY SLOT. The commencement schedule determines whether an
      obligation is presently enforceable or merely forthcoming, which changes
      every finding in the report from a breach into a readiness gap or the
      reverse. The toolkit therefore reports compliance posture against the
      full framework and records commencement as an explicit, unresolved
      scoping assumption rather than silently assuming all duties are live.
      Resolve this before issuing any report that characterises a gap as a
      contravention.
