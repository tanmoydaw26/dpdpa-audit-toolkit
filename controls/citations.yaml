# =============================================================================
# DPDPA AUDIT TOOLKIT — CENTRAL CITATION REGISTRY
# =============================================================================
#
# This is the ONLY file you need to edit to add verified DPDP Rules citations.
# Every control in controls/*.yaml references a rule slot by key (rule_slot:).
# Fill in `citation:` here once, flip `status:` to VERIFIED_RULES, and the
# citation propagates to the control matrix, the gap register, the Word report
# and the web app automatically.
#
# CITATION STATUS VALUES
#   VERIFIED_ACT    — Statutory text of the DPDP Act, 2023 (Act No. 22 of 2023).
#                     Stable, unamended, high confidence.
#   VERIFIED_RULES  — Confirmed against the notified DPDP Rules by a named
#                     reviewer. Record who and when in `verified_by` /
#                     `verified_on`.
#   VERIFY_AGAINST_NOTIFIED_RULES
#                   — Subject matter is known to be dealt with by the Rules,
#                     but the rule number is NOT populated. Deliberately blank.
#                     Reported in the "Unverified Citations" appendix.
#
# WHY THE SLOTS ARE EMPTY
#   The toolkit was authored without access to the notified Rules text. Rule
#   numbers were left blank rather than reconstructed from memory, because an
#   incorrect statutory citation inside a signed audit report is materially
#   worse than a visibly absent one — it passes review and reaches the
#   regulator unchallenged. Populate from the eGazette notification or the
#   MeitY-published Rules before issuing a report externally.
# =============================================================================

meta:
  registry_version: "1.0.0"
  act_short_name: "DPDP Act, 2023"
  act_long_name: "The Digital Personal Data Protection Act, 2023 (Act No. 22 of 2023)"
  rules_short_name: "DPDP Rules"
  rules_status_note: >-
    Rule numbering, phased commencement dates and prescribed thresholds were
    not verifiable at authoring time. Each rule slot below carries the subject
    matter the Rules are understood to address, with the citation left blank.
  primary_sources_to_check:
    - "eGazette notification of the Digital Personal Data Protection Rules — egazette.gov.in"
    - "MeitY data protection framework page — meity.gov.in"
    - "India Code, DPDP Act 2023 bare text — india-code.nic.in"
    - "Any MeitY FAQ or business-requirements document issued alongside the Rules"

# -----------------------------------------------------------------------------
# PENALTY SCHEDULE — Section 33 read with the Schedule to the DPDP Act, 2023
# -----------------------------------------------------------------------------
# Maximum penalties the Data Protection Board may impose per the Schedule.
# These are Act-level (not Rules-level) and are cited with confidence.
# Entry numbering follows the Schedule as enacted.
# -----------------------------------------------------------------------------
penalty_schedule:
  status: VERIFIED_ACT
  source: "Section 33 read with the Schedule, DPDP Act, 2023"
  currency: INR
  entries:
    - entry: 1
      breach: "Breach of the obligation to take reasonable security safeguards to prevent personal data breach"
      provision: "s.8(5)"
      max_penalty_inr_crore: 250
      label: "Up to INR 250 crore"
    - entry: 2
      breach: "Breach of the obligation to give the Board or affected Data Principal notice of a personal data breach"
      provision: "s.8(6)"
      max_penalty_inr_crore: 200
      label: "Up to INR 200 crore"
    - entry: 3
      breach: "Breach of additional obligations in relation to children"
      provision: "s.9"
      max_penalty_inr_crore: 200
      label: "Up to INR 200 crore"
    - entry: 4
      breach: "Breach of additional obligations of a Significant Data Fiduciary"
      provision: "s.10"
      max_penalty_inr_crore: 150
      label: "Up to INR 150 crore"
    - entry: 5
      breach: "Breach of the duties of a Data Principal"
      provision: "s.15"
      max_penalty_inr_crore: 0.001
      label: "Up to INR 10,000"
    - entry: 6
      breach: "Breach of any term of a voluntary undertaking accepted by the Board"
      provision: "s.32"
      max_penalty_inr_crore: null
      label: "Up to the extent applicable for the breach in respect of which proceedings were instituted"
    - entry: 7
      breach: "Breach of any other provision of the Act or rules made thereunder (residuary)"
      provision: "residuary"
      max_penalty_inr_crore: 50
      label: "Up to INR 50 crore"
  determination_factors_note: >-
    Section 33(2) requires the Board, when determining quantum, to have regard to
    factors including the nature, gravity and duration of the breach, the type and
    nature of the personal data affected, repetitive nature of the breach, whether
    any gain was realised or loss avoided, mitigating action taken and its
    timeliness and effectiveness, proportionality and effectiveness of the penalty,
    and the likely impact of the penalty on the person. Auditors should note that
    documented, timely mitigation is an express mitigating factor — which is itself
    an argument for maintaining the evidence this toolkit collects.

